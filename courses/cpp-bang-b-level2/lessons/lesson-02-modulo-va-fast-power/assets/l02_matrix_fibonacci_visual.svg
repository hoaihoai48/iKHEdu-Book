<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="40" y="42" fill="#0F2A44" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Sơ đồ nhân Ma trận 2×2 tính số Fibonacci thứ N trong O(log N)</text>
  <text x="40" y="68" fill="#475569" font-family="Arial, sans-serif" font-size="13">Chuyển hệ thức truy hồi tuyến tính Fn = Fn-1 + Fn-2 thành phép nhân lũy thừa ma trận cơ sở.</text>

  <!-- Matrix Equation -->
  <g transform="translate(50, 110)">
    <!-- Matrix Vector 1 -->
    <rect x="0" y="0" width="80" height="110" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="40" y="45" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n+1)</text>
    <text x="40" y="85" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n)</text>
    
    <text x="105" y="65" fill="#1E293B" font-family="sans-serif" font-size="24" font-weight="bold">=</text>

    <!-- Transition Matrix T -->
    <g transform="translate(135, 0)">
      <rect x="0" y="0" width="120" height="110" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="60" y="25" fill="#92400E" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ma trận T</text>
      <text x="35" y="60" fill="#B45309" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">1</text>
      <text x="85" y="60" fill="#B45309" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">1</text>
      <text x="35" y="95" fill="#B45309" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">1</text>
      <text x="85" y="95" fill="#B45309" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">0</text>
    </g>

    <text x="275" y="65" fill="#1E293B" font-family="sans-serif" font-size="24" font-weight="bold">×</text>

    <!-- Matrix Vector 2 -->
    <g transform="translate(305, 0)">
      <rect x="0" y="0" width="80" height="110" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="40" y="45" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n)</text>
      <text x="40" y="85" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n-1)</text>
    </g>

    <text x="415" y="65" fill="#1E293B" font-family="sans-serif" font-size="24" font-weight="bold">=</text>

    <!-- Result Matrix Power -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="130" height="110" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="65" y="25" fill="#065F46" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ma trận T^n</text>
      <text x="40" y="60" fill="#047857" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n+1)</text>
      <text x="95" y="60" fill="#047857" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n)</text>
      <text x="40" y="95" fill="#047857" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n)</text>
      <text x="95" y="95" fill="#047857" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(n-1)</text>
    </g>

    <text x="605" y="65" fill="#1E293B" font-family="sans-serif" font-size="24" font-weight="bold">×</text>

    <!-- Base Vector -->
    <g transform="translate(635, 0)">
      <rect x="0" y="0" width="80" height="110" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
      <text x="40" y="25" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cơ sở</text>
      <text x="40" y="55" fill="#0F172A" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(1)=1</text>
      <text x="40" y="90" fill="#0F172A" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F(0)=0</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <g transform="translate(50, 245)">
    <rect width="800" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="400" y="30" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">[Ghi nhớ] Áp dụng lũy thừa nhị phân ma trận (Matrix Exponentiation) cho phép tính F(10¹⁸) chỉ trong ~60 phép nhân ma trận!</text>
  </g>
</svg>