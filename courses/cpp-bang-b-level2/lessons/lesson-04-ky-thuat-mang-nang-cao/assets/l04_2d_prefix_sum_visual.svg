<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="40" y="42" fill="#0F2A44" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Nguyên lý Mảng cộng dồn 2D (2D Prefix Sum) &amp; Truy vấn hình chữ nhật O(1)</text>
  <text x="40" y="68" fill="#475569" font-family="Arial, sans-serif" font-size="13">Công thức tính tổng vùng đỏ (x1,y1) → (x2,y2): Sum = S[x2][y2] - S[x1-1][y2] - S[x2][y1-1] + S[x1-1][y1-1]</text>

  <!-- Big Matrix Representation -->
  <g transform="translate(50, 100)">
    <!-- Base Matrix Grid -->
    <rect x="0" y="0" width="360" height="220" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Top-Left Overlap (x1-1, y1-1) - Purple -->
    <rect x="0" y="0" width="120" height="80" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="60" y="45" fill="#4338CA" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">S[x1-1][y1-1] (Cộng lại)</text>

    <!-- Top Strip - Yellow -->
    <rect x="120" y="0" width="180" height="80" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="4" stroke-width="1.5"/>
    <text x="210" y="45" fill="#B45309" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Vùng trừ trên</text>

    <!-- Left Strip - Blue -->
    <rect x="0" y="80" width="120" height="110" fill="#DBEAFE" stroke="#3B82F6" stroke-dasharray="4" stroke-width="1.5"/>
    <text x="60" y="140" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Vùng trừ trái</text>

    <!-- Target Rectangle - Red -->
    <rect x="120" y="80" width="180" height="110" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
    <text x="210" y="130" fill="#B91C1C" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">VÙNG CẦN TÍNH</text>
    <text x="210" y="155" fill="#DC2626" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">(x1, y1) → (x2, y2)</text>

    <!-- Boundary Points -->
    <circle cx="120" cy="80" r="5" fill="#EF4444"/>
    <text x="105" y="75" fill="#B91C1C" font-family="sans-serif" font-size="11" font-weight="bold">(x1, y1)</text>

    <circle cx="300" cy="190" r="5" fill="#EF4444"/>
    <text x="310" y="205" fill="#B91C1C" font-family="sans-serif" font-size="11" font-weight="bold">(x2, y2)</text>
  </g>

  <!-- Explanation Panel on the Right -->
  <g transform="translate(450, 100)">
    <rect width="400" height="220" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="32" fill="#0F172A" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Bản chất nguyên lý Bao hàm - Loại trừ:</text>
    
    <text x="20" y="65" fill="#1E293B" font-family="Arial, sans-serif" font-size="14">1. Lấy toàn bộ hình chữ nhật lớn từ gốc (1,1) đến (x2,y2):</text>
    <text x="40" y="88" fill="#2563EB" font-family="monospace" font-size="13" font-weight="bold">+ S[x2][y2]</text>

    <text x="20" y="115" fill="#1E293B" font-family="Arial, sans-serif" font-size="14">2. Trừ đi phần thừa phía trên và phía bên trái:</text>
    <text x="40" y="138" fill="#DC2626" font-family="monospace" font-size="13" font-weight="bold">- S[x1-1][y2]  -  S[x2][y1-1]</text>

    <text x="20" y="165" fill="#1E293B" font-family="Arial, sans-serif" font-size="14">3. Phần góc giao (x1-1, y1-1) bị trừ 2 lần nên phải cộng lại:</text>
    <text x="40" y="188" fill="#16A34A" font-family="monospace" font-size="13" font-weight="bold">+ S[x1-1][y1-1]</text>
  </g>
</svg>