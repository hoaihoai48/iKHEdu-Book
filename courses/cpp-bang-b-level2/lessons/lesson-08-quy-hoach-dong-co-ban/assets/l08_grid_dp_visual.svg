<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%">
  <rect width="900" height="350" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="40" y="42" fill="#0F2A44" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Quy hoạch động trên Lưới 2D (Grid DP) — Tìm đường đi có tổng điểm lớn nhất</text>
  <text x="40" y="68" fill="#475569" font-family="Arial, sans-serif" font-size="13">Công thức chuyển trạng thái: dp[i][j] = A[i][j] + max(dp[i-1][j], dp[i][j-1]). Chỉ đi xuống hoặc sang phải.</text>

  <!-- Grid Layout -->
  <g transform="translate(80, 100)">
    <!-- Cell (i-1, j) - Top -->
    <g transform="translate(160, 10)">
      <rect width="110" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="55" y="24" fill="#1E40AF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">(i-1, j)</text>
      <text x="55" y="44" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">dp[i-1][j]</text>
    </g>

    <!-- Down Arrow -->
    <line x1="215" y1="70" x2="215" y2="105" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="215,110 210,100 220,100" fill="#3B82F6"/>

    <!-- Cell (i, j-1) - Left -->
    <g transform="translate(30, 115)">
      <rect width="110" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="55" y="24" fill="#1E40AF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">(i, j-1)</text>
      <text x="55" y="44" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">dp[i][j-1]</text>
    </g>

    <!-- Right Arrow -->
    <line x1="145" y1="142" x2="155" y2="142" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="160,142 150,137 150,147" fill="#3B82F6"/>

    <!-- Target Cell (i, j) -->
    <g transform="translate(160, 115)">
      <rect width="110" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/>
      <text x="55" y="24" fill="#92400E" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ô ĐÍCH (i, j)</text>
      <text x="55" y="44" fill="#B45309" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">dp[i][j]</text>
    </g>
  </g>

  <!-- Complexity and Invariant Panel -->
  <g transform="translate(420, 100)">
    <rect width="420" height="200" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="25" y="32" fill="#0F172A" font-family="Arial, sans-serif" font-size="16" font-weight="bold">(*) Đặc điểm cấu trúc DP Lưới 2D:</text>
    <text x="25" y="65" fill="#334155" font-family="Arial, sans-serif" font-size="13">• <tspan font-weight="bold">Thứ tự tính toán:</tspan> Duyệt theo thứ tự hàng từ trên xuống dưới, cột từ trái sang phải.</text>
    <text x="25" y="95" fill="#334155" font-family="Arial, sans-serif" font-size="13">• <tspan font-weight="bold">Khởi tạo biên:</tspan> Hàng 1 và Cột 1 là các giá trị cộng dồn trực tiếp.</text>
    <text x="25" y="125" fill="#334155" font-family="Arial, sans-serif" font-size="13">• <tspan font-weight="bold">Độ phức tạp:</tspan> Thời gian O(N × M), Bộ nhớ O(N × M) hoặc nén về O(M).</text>
    <text x="25" y="160" fill="#15803D" font-family="Arial, sans-serif" font-size="14" font-weight="bold">-> Truy vết: Đi ngược từ (N, M) về (1, 1) theo hướng có dp lớn hơn!</text>
  </g>
</svg>