<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="40" y="42" fill="#0F2A44" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Mô phỏng Chặt nhị phân trên tập số thực (Binary Search on Real Numbers)</text>
  <text x="40" y="68" fill="#475569" font-family="Arial, sans-serif" font-size="13">Không gian nghiệm liên tục [L, R]. Lặp cố định 100 lần để đạt độ chính xác tuyệt đối 10⁻¹⁵.</text>

  <!-- Number Line Axis -->
  <g transform="translate(60, 120)">
    <line x1="0" y1="50" x2="780" y2="50" stroke="#94A3B8" stroke-width="4"/>
    
    <!-- Left Boundary L -->
    <circle cx="50" cy="50" r="10" fill="#3B82F6"/>
    <text x="50" y="25" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">L (Cận dưới)</text>
    <text x="50" y="80" fill="#64748B" font-family="monospace" font-size="13" text-anchor="middle">L = 0.0</text>

    <!-- Right Boundary R -->
    <circle cx="730" cy="50" r="10" fill="#3B82F6"/>
    <text x="730" y="25" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">R (Cận trên)</text>
    <text x="730" y="80" fill="#64748B" font-family="monospace" font-size="13" text-anchor="middle">R = 100.0</text>

    <!-- Mid Point -->
    <circle cx="390" cy="50" r="12" fill="#EF4444"/>
    <text x="390" y="20" fill="#DC2626" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Mid = (L + R) / 2</text>
    <text x="390" y="85" fill="#B91C1C" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Kiểm tra check(mid)</text>

    <!-- Discard Left region -->
    <rect x="50" y="38" width="340" height="24" rx="4" fill="#FEE2E2" opacity="0.6"/>
    <text x="220" y="55" fill="#991B1B" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Loại bỏ nửa trái (L = mid)</text>
  </g>

  <!-- Bottom Box -->
  <g transform="translate(60, 240)">
    <rect width="780" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="390" y="30" fill="#1E293B" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">[Ghi nhớ] Quy tắc vàng: Dùng vòng lặp for (int iter = 0; iter &lt; 100; ++iter) để tránh lỗi lặp vô tận do sai số float/double!</text>
  </g>
</svg>