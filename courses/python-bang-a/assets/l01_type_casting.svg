<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="100%">
  <defs>
    <linearGradient id="strGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="intGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowCasting" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="290" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="798" height="288" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">
    BÍ MẬT ÉP KIỂU: SỰ KHÁC BIỆT GIỮA CHUỖI (STR) VÀ SỐ NGUYÊN (INT)
  </text>

  <!-- Left: Raw Input (str) -->
  <g transform="translate(60, 65)" filter="url(#shadowCasting)">
    <rect width="210" height="175" rx="12" fill="url(#strGrad)"/>
    <text x="105" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">KHI CHƯA ÉP KIỂU</text>
    
    <rect x="15" y="45" width="180" height="115" rx="8" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="105" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FEF3C7">a = input()  # Nhập 5</text>
    <text x="105" y="92" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FEF3C7">b = input()  # Nhập 3</text>
    <line x1="25" y1="103" x2="185" y2="103" stroke="#FEF3C7" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="105" y="123" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">a + b = "53"</text>
    <text x="105" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#FEF3C7">❌ Nối dính chữ cái</text>
  </g>

  <!-- Center: The Type Cast Machine -->
  <g transform="translate(310, 85)">
    <circle cx="90" cy="55" r="45" fill="#3B82F6" stroke="#2563EB" stroke-width="3" filter="url(#shadowCasting)"/>
    <text x="90" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#FFFFFF">int()</text>
    <text x="90" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#DBEAFE">Ép sang số</text>
    
    <!-- Arrows -->
    <path d="M -25 55 L 35 55" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="35,50 45,55 35,60" fill="#3B82F6"/>
    <path d="M 135 55 L 195 55" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="195,50 205,55 195,60" fill="#10B981"/>
  </g>

  <!-- Right: Casted Output (int) -->
  <g transform="translate(530, 65)" filter="url(#shadowCasting)">
    <rect width="210" height="175" rx="12" fill="url(#intGrad)"/>
    <text x="105" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">KHI ĐÃ ÉP KIỂU INT()</text>
    
    <rect x="15" y="45" width="180" height="115" rx="8" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="105" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#D1FAE5">a = int(input()) # 5</text>
    <text x="105" y="92" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#D1FAE5">b = int(input()) # 3</text>
    <line x1="25" y1="103" x2="185" y2="103" stroke="#D1FAE5" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="105" y="123" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#FFFFFF">a + b = 8</text>
    <text x="105" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#D1FAE5">✅ Cộng số học chuẩn xác</text>
  </g>

  <!-- Bottom note -->
  <text x="400" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-style="italic" fill="#64748B">
    Quy tắc phòng thi: Cần tính toán số học, luôn luôn bọc lệnh input() bên trong int() hoặc float().
  </text>
</svg>
