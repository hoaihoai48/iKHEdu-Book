<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="300" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="798" height="298" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">
    BẢN CHẤT CỦA BIẾN SỐ TRONG BỘ NHỚ RAM VÀ PHÉP GÁN ĐÈ
  </text>

  <!-- Step 1: Initial Assignment -->
  <g transform="translate(60, 65)" filter="url(#shadowBox)">
    <rect width="200" height="180" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="40" rx="12" fill="#3B82F6"/>
    <rect x="0" y="25" width="200" height="15" fill="#3B82F6"/>
    <text x="100" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#FFFFFF">x = 10</text>
    
    <!-- Box Visual -->
    <rect x="35" y="60" width="130" height="85" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="100" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#3B82F6">Nhãn: biến x</text>
    <circle cx="100" cy="115" r="22" fill="#3B82F6"/>
    <text x="100" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#FFFFFF">10</text>
    <text x="100" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">RAM lưu số 10</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 275 155 L 305 155" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="305,150 315,155 305,160" fill="#94A3B8"/>

  <!-- Step 2: Calculation -->
  <g transform="translate(325, 65)" filter="url(#shadowBox)">
    <rect width="200" height="180" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="40" rx="12" fill="#10B981"/>
    <rect x="0" y="25" width="200" height="15" fill="#10B981"/>
    <text x="100" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#FFFFFF">x = x + 5</text>
    
    <!-- Calculation detail -->
    <rect x="25" y="55" width="150" height="95" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="100" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#047857">1. Đọc x cũ: 10</text>
    <text x="100" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#047857">2. Tính: 10 + 5 = 15</text>
    <text x="100" y="118" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#059669">Mới: 15</text>
    <text x="100" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#059669">Nạp đè vào biến x</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 540 155 L 570 155" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="570,150 580,155 570,160" fill="#94A3B8"/>

  <!-- Step 3: Re-assignment Overwrite -->
  <g transform="translate(590, 65)" filter="url(#shadowBox)">
    <rect width="170" height="180" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="40" rx="12" fill="#EF4444"/>
    <rect x="0" y="25" width="170" height="15" fill="#EF4444"/>
    <text x="85" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#FFFFFF">x = 99</text>
    
    <!-- Overwrite Box -->
    <rect x="20" y="60" width="130" height="85" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
    <text x="85" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-decoration="line-through" fill="#9CA3AF">Số cũ 15 bị xóa</text>
    <circle cx="85" cy="115" r="22" fill="#EF4444"/>
    <text x="85" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#FFFFFF">99</text>
    <text x="85" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#DC2626">Giá trị cuối: 99</text>
  </g>

  <!-- Bottom note -->
  <text x="400" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-style="italic" fill="#64748B">
    Phép gán (=) không phải dấu bằng toán học. Máy tính luôn tính vế phải trước, sau đó ghi đè kết quả vào biến ở vế trái.
  </text>
</svg>
