<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="300" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="918" height="298" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">
    HỆ THỐNG CHỈ SỐ DƯƠNG VÀ ÂM CỦA CHUỖI TRONG BỘ NHỚ RAM
  </text>
  <text x="460" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#64748B">
    Ví dụ minh họa với chuỗi ký tự s = "PYTHON" (Độ dài len(s) = 6)
  </text>

  <!-- Positive index label -->
  <text x="110" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#0284C7">
    Chỉ số dương:
  </text>

  <!-- Character boxes -->
  <!-- 6 boxes: width=80, height=80, gap=20, start_x=220 -->
  <!-- Box 0: P -->
  <g filter="url(#shadowBox)">
    <!-- Positive index -->
    <text x="260" y="102" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#0284C7">0</text>
    <rect x="220" y="115" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="260" y="160" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#0F172A">'P'</text>
    <text x="260" y="212" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#DC2626">-6</text>
  </g>

  <!-- Box 1: Y -->
  <g filter="url(#shadowBox)">
    <text x="360" y="102" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#0284C7">1</text>
    <rect x="320" y="115" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="360" y="160" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#0F172A">'Y'</text>
    <text x="360" y="212" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#DC2626">-5</text>
  </g>

  <!-- Box 2: T -->
  <g filter="url(#shadowBox)">
    <text x="460" y="102" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#0284C7">2</text>
    <rect x="420" y="115" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="460" y="160" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#0F172A">'T'</text>
    <text x="460" y="212" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#DC2626">-4</text>
  </g>

  <!-- Box 3: H -->
  <g filter="url(#shadowBox)">
    <text x="560" y="102" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#0284C7">3</text>
    <rect x="520" y="115" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="560" y="160" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#0F172A">'H'</text>
    <text x="560" y="212" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#DC2626">-3</text>
  </g>

  <!-- Box 4: O -->
  <g filter="url(#shadowBox)">
    <text x="660" y="102" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#0284C7">4</text>
    <rect x="620" y="115" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="660" y="160" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#0F172A">'O'</text>
    <text x="660" y="212" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#DC2626">-2</text>
  </g>

  <!-- Box 5: N -->
  <g filter="url(#shadowBox)">
    <text x="760" y="102" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#0284C7">5</text>
    <rect x="720" y="115" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="760" y="160" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#0F172A">'N'</text>
    <text x="760" y="212" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#DC2626">-1</text>
  </g>

  <!-- Negative index label -->
  <text x="110" y="212" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#DC2626">
    Chỉ số âm:
  </text>

  <!-- Bottom note -->
  <text x="460" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-style="italic" fill="#475569">
    Quy tắc vàng: Chỉ số dương chạy từ 0 đến len(s)-1. Chỉ số âm chạy từ -1 (cuối chuỗi) ngược về -len(s) (đầu chuỗi).
  </text>
</svg>
