<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="520" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="520" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">CÂY QUYẾT ĐỊNH LỰA CHỌN THUẬT TOÁN CHIA ĐỂ TRỊ (D&amp;C DECISION TREE)</text>
  <text x="500" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Nhận diện chính xác hình thái thuật toán phù hợp với bản chất bài toán</text>
  <g transform="translate(370, 95)" filter="url(#cardShadow)">
    <rect width="260" height="55" rx="10" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <text x="130" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">BÀI TOÁN CẦN GIẢI</text>
    <text x="130" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Đánh giá cấu trúc dữ liệu</text>
  </g>
  <path d="M 500 150 L 500 190" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <g transform="translate(320, 195)" filter="url(#cardShadow)">
    <rect width="360" height="60" rx="10" fill="url(#cyanCard)" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="180" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Có thể chia thành các bài toán con</text>
    <text x="180" y="46" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">cùng bản chất và nhỏ hơn không?</text>
  </g>
  <path d="M 370 255 L 200 320" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)" />
  <rect x="240" y="270" width="50" height="24" rx="4" fill="#7f1d1d" /><text x="265" y="286" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KHÔNG</text>
  <g transform="translate(70, 325)" filter="url(#cardShadow)">
    <rect width="250" height="150" rx="10" fill="url(#redCard)" stroke="#ef4444" stroke-width="1.5" filter="url(#glowRed)" />
    <text x="125" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">KHÔNG DÙNG D&amp;C</text>
    <text x="125" y="60" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">• Chuyển sang Tham lam (Greedy)</text>
    <text x="125" y="85" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">• Quy hoạch động (DP)</text>
    <text x="125" y="110" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">• Duyệt tuần tự / Hai con trỏ</text>
    <text x="125" y="135" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Không có cấu trúc phân rã</text>
  </g>
  <path d="M 630 255 L 680 300" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="650" y="265" width="40" height="24" rx="4" fill="#064e3b" /><text x="670" y="281" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CÓ</text>
  <g transform="translate(520, 305)" filter="url(#cardShadow)">
    <rect width="360" height="55" rx="10" fill="url(#cyanCard)" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="180" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Cần giải quyết bao nhiêu bài toán con?</text>
    <text x="180" y="44" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Quyết định số lượng nhánh đệ quy</text>
  </g>
  <path d="M 600 360 L 510 405" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <g transform="translate(370, 410)" filter="url(#cardShadow)">
    <rect width="270" height="85" rx="10" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowCyan)" />
    <text x="135" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">D&amp;C ĐƠN NHÁNH (O(log N))</text>
    <text x="135" y="46" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">• Binary Search (Chặt nhị phân)</text>
    <text x="135" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">• QuickSelect, Peak Finding</text>
  </g>
  <path d="M 800 360 L 840 405" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <g transform="translate(680, 410)" filter="url(#cardShadow)">
    <rect width="280" height="85" rx="10" fill="url(#greenCard)" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)" />
    <text x="140" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">D&amp;C ĐA NHÁNH (O(N log N))</text>
    <text x="140" y="46" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">• Merge Sort, Inversion Counting</text>
    <text x="140" y="68" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">• Closest Pair of Points</text>
  </g>

</svg>