<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0284C7" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" /></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#DC2626" /></marker>
  </defs>

  <rect width="1000" height="520" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">CÂY QUYẾT ĐỊNH LỰA CHỌN THUẬT TOÁN CHIA ĐỂ TRỊ (D&amp;C DECISION TREE)</text>
  <text x="500" y="68" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Nhận diện chính xác hình thái thuật toán phù hợp với bản chất bài toán</text>

  <!-- Level 0: Problem -->
  <g transform="translate(370, 95)" filter="url(#cardShadow)">
    <rect width="260" height="55" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="130" y="27" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">BÀI TOÁN CẦN GIẢI</text>
    <text x="130" y="45" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Đánh giá cấu trúc dữ liệu</text>
  </g>

  <path d="M 500 150 L 500 190" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Level 1: Question 1 -->
  <g transform="translate(320, 195)" filter="url(#cardShadow)">
    <rect width="360" height="60" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="180" y="26" fill="#0369A1" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Có thể chia thành các bài toán con</text>
    <text x="180" y="46" fill="#0284C7" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">cùng bản chất và nhỏ hơn không?</text>
  </g>

  <!-- Branch NO -->
  <path d="M 370 255 L 200 320" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)" />
  <rect x="235" y="268" width="60" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1" />
  <text x="265" y="284" fill="#991B1B" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">KHÔNG</text>

  <g transform="translate(70, 325)" filter="url(#cardShadow)">
    <rect width="250" height="155" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
    <text x="125" y="32" fill="#991B1B" font-family="system-ui, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">KHÔNG DÙNG D&amp;C</text>
    <text x="25" y="62" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Tham lam (Greedy)</text>
    <text x="25" y="87" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Quy hoạch động (DP)</text>
    <text x="25" y="112" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Hai con trỏ / Sliding Window</text>
    <rect x="20" y="125" width="210" height="22" rx="4" fill="#FEE2E2" />
    <text x="125" y="140" fill="#991B1B" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Không có cấu trúc phân rã</text>
  </g>

  <!-- Branch YES -->
  <path d="M 630 255 L 680 300" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="645" y="265" width="50" height="24" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1" />
  <text x="670" y="281" fill="#065F46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">CÓ</text>

  <!-- Level 2: Question 2 -->
  <g transform="translate(520, 305)" filter="url(#cardShadow)">
    <rect width="360" height="55" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="180" y="25" fill="#0369A1" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Cần giải quyết bao nhiêu bài toán con?</text>
    <text x="180" y="44" fill="#0284C7" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Quyết định số lượng nhánh đệ quy</text>
  </g>

  <!-- Sub-branch 1: Single Branch -->
  <path d="M 600 360 L 510 405" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowCyan)" />
  <g transform="translate(370, 410)" filter="url(#cardShadow)">
    <rect width="270" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="135" y="25" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">D&amp;C ĐƠN NHÁNH (O(log N))</text>
    <text x="25" y="52" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12">• <tspan font-weight="600" fill="#1D4ED8">Binary Search</tspan> (Chặt nhị phân)</text>
    <text x="25" y="74" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12">• <tspan font-weight="600" fill="#1D4ED8">QuickSelect</tspan>, Peak Finding</text>
  </g>

  <!-- Sub-branch 2: Multi Branch -->
  <path d="M 800 360 L 840 405" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
  <g transform="translate(680, 410)" filter="url(#cardShadow)">
    <rect width="280" height="90" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <text x="140" y="25" fill="#065F46" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">D&amp;C ĐA NHÁNH (O(N log N))</text>
    <text x="25" y="52" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12">• <tspan font-weight="600" fill="#047857">Merge Sort</tspan>, Inversion Counting</text>
    <text x="25" y="74" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12">• Closest Pair of Points</text>
  </g>
</svg>