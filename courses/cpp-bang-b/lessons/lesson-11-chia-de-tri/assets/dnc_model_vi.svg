<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="600" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">MÔ HÌNH THUẬT TOÁN CHIA ĐỂ TRỊ (DIVIDE &amp; CONQUER)</text>
  <text x="500" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">3 Pha Chuẩn Mực: Phân Chia (Divide) ➔ Đệ Quy Giải Quyết (Solve) ➔ Tổng Hợp Nghiệm (Combine)</text>
  <g transform="translate(350, 110)" filter="url(#cardShadow)">
    <rect width="300" height="70" rx="12" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <text x="150" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">BÀI TOÁN GỐC QUY MÔ N</text>
    <text x="150" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Kích thước dữ liệu ban đầu cần xử lý</text>
  </g>
  <path d="M 430 180 L 280 235" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowCyan)" />
  <path d="M 570 180 L 720 235" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowCyan)" />
  <rect x="290" y="190" width="140" height="26" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="360" y="207" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PHÂN CHIA (N/2)</text>
  <rect x="570" y="190" width="140" height="26" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="640" y="207" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PHÂN CHIA (N/2)</text>
  <g transform="translate(130, 245)" filter="url(#cardShadow)">
    <rect width="280" height="65" rx="10" fill="url(#cyanCard)" stroke="#0284c7" stroke-width="1.5" />
    <text x="140" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BÀI TOÁN CON 1 (NỬA TRÁI)</text>
    <text x="140" y="48" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Quy mô thu nhỏ N/2</text>
  </g>
  <g transform="translate(590, 245)" filter="url(#cardShadow)">
    <rect width="280" height="65" rx="10" fill="url(#cyanCard)" stroke="#0284c7" stroke-width="1.5" />
    <text x="140" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BÀI TOÁN CON 2 (NỬA PHẢI)</text>
    <text x="140" y="48" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Quy mô thu nhỏ N/2</text>
  </g>
  <path d="M 270 310 L 270 365" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <path d="M 730 310 L 730 365" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <text x="210" y="342" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ĐỆ QUY GIẢI</text>
  <text x="790" y="342" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ĐỆ QUY GIẢI</text>
  <g transform="translate(140, 375)" filter="url(#cardShadow)">
    <rect width="260" height="60" rx="10" fill="url(#greenCard)" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)" />
    <text x="130" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">ĐÁP ÁN BÀI TOÁN CON 1</text>
    <text x="130" y="45" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Kết quả tối ưu nửa trái</text>
  </g>
  <g transform="translate(600, 375)" filter="url(#cardShadow)">
    <rect width="260" height="60" rx="10" fill="url(#greenCard)" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)" />
    <text x="130" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">ĐÁP ÁN BÀI TOÁN CON 2</text>
    <text x="130" y="45" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Kết quả tối ưu nửa phải</text>
  </g>
  <path d="M 270 435 L 430 490" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)" />
  <path d="M 730 435 L 570 490" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)" />
  <text x="320" y="475" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">GỘP KẾT QUẢ</text>
  <text x="680" y="475" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">GỘP KẾT QUẢ</text>
  <g transform="translate(330, 495)" filter="url(#cardShadow)">
    <rect width="340" height="75" rx="12" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber)" />
    <text x="170" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">LỜI GIẢI TOÀN CỤC BÀI TOÁN GỐC (N)</text>
    <text x="170" y="55" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Độ phức tạp: T(N) = 2T(N/2) + O(Combine)</text>
  </g>

</svg>