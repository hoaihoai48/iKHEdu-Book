<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="400" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Đặc Tính Bất Biến Của Cây (Tree Invariants): N Đỉnh &amp; N-1 Cạnh</text>
  <text x="40" y="62" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cây là đồ thị vô hướng, liên thông và không chứa bất kỳ chu trình nào</text>

  <!-- Two Cards: Visual Tree vs 3 Equivalent Conditions -->
  <g transform="translate(40, 85)">
    <!-- Left Card: Tree Graph Visualization -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="360" height="285" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="25" y="30" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Mô Hình Cây Tự Do (N = 5, E = 4 Cạnh)</text>

      <!-- Tree Nodes and Edges centered around X=180 -->
      <g transform="translate(0, 38)">
        <!-- Edges: 1-2, 1-3, 2-4, 2-5 -->
        <line x1="180" y1="28" x2="105" y2="82" stroke="#94A3B8" stroke-width="2.5"/>
        <line x1="180" y1="28" x2="255" y2="82" stroke="#94A3B8" stroke-width="2.5"/>
        <line x1="105" y1="82" x2="65" y2="142" stroke="#94A3B8" stroke-width="2.5"/>
        <line x1="105" y1="82" x2="145" y2="142" stroke="#94A3B8" stroke-width="2.5"/>

        <!-- Root Node 1 -->
        <circle cx="180" cy="28" r="28" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
        <text x="180" y="24" fill="#065F46" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Gốc</text>
        <text x="180" y="42" fill="#065F46" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">1</text>

        <!-- Node 2 -->
        <circle cx="105" cy="82" r="18" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
        <text x="105" y="87" fill="#1E293B" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">2</text>

        <!-- Node 3 -->
        <circle cx="255" cy="82" r="18" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
        <text x="255" y="87" fill="#1E293B" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">3</text>

        <!-- Leaf Node 4 -->
        <circle cx="65" cy="142" r="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
        <text x="65" y="147" fill="#475569" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">4</text>

        <!-- Leaf Node 5 -->
        <circle cx="145" cy="142" r="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
        <text x="145" y="147" fill="#475569" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">5</text>
      </g>

      <!-- Bottom Card note -->
      <g transform="translate(25, 230)">
        <rect width="310" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text x="155" y="22" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Số cạnh luôn luôn bằng: E = N - 1 = 4</text>
      </g>
    </g>

    <!-- Right Card: 3 Equivalent Conditions -->
    <g transform="translate(385, 0)" filter="url(#cardShadow)">
      <rect width="475" height="285" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="20" y="28" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">3 Điều Kiện Định Nghĩa Cây Tương Đương</text>
      <text x="20" y="48" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Cho đồ thị vô hướng G = (V, E) gồm N đỉnh, G là CÂY khi thỏa 1 trong 3 điều kiện:</text>

      <!-- Condition 1 -->
      <g transform="translate(20, 58)">
        <rect width="435" height="42" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
        <text x="12" y="18" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1. G liên thông và có đúng N - 1 cạnh</text>
        <text x="12" y="34" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11">Nếu thêm 1 cạnh bất kỳ sẽ lập tức tạo thành chu trình.</text>
      </g>

      <!-- Condition 2 -->
      <g transform="translate(20, 106)">
        <rect width="435" height="42" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
        <text x="12" y="18" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2. G không có chu trình (Acyclic) và có đúng N - 1 cạnh</text>
        <text x="12" y="34" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11">Nếu xóa đi 1 cạnh bất kỳ sẽ làm đồ thị mất tính liên thông.</text>
      </g>

      <!-- Condition 3 -->
      <g transform="translate(20, 154)">
        <rect width="435" height="42" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
        <text x="12" y="18" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">3. Giữa 2 đỉnh bất kỳ u và v có duy nhất 1 đường đi đơn</text>
        <text x="12" y="34" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11">Đường đi ngắn nhất giữa hai đỉnh cũng chính là đường đi duy nhất.</text>
      </g>

      <!-- Practical Tip Box -->
      <g transform="translate(20, 204)">
        <rect width="435" height="65" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
        <text x="12" y="18" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Mẹo lập trình thi đấu (DFS Trên Cây):</text>
        <text x="12" y="36" fill="#78350F" font-family="system-ui, -apple-system, sans-serif" font-size="11">Duyệt Cây từ gốc không cần mảng visited, chỉ cần tránh đi ngược lại đỉnh cha:</text>
        <text x="12" y="54" fill="#0369A1" font-family="monospace" font-size="11.5" font-weight="700">for (int v : adj[u]) if (v != parent) dfs(v, u);</text>
      </g>
    </g>
  </g>
</svg>
