<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ĐẶC TÍNH BẤT BIẾN CỦA CÂY (TREE INVARIANTS): N ĐỈNH &amp; N-1 CẠNH</text>

  <!-- Tree drawing -->
  <g transform="translate(100, 70)">
    <circle cx="200" cy="40" r="22" fill="#047857" stroke="#4ade80" stroke-width="2"/>
    <text x="200" y="46" fill="#f8fafc" font-weight="bold" text-anchor="middle">Gốc 1</text>

    <line x1="185" y1="56" x2="105" y2="114" stroke="#94a3b8" stroke-width="2"/>
    <line x1="215" y1="56" x2="295" y2="114" stroke="#94a3b8" stroke-width="2"/>

    <circle cx="90" cy="130" r="20" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="135" fill="#f8fafc" text-anchor="middle">2</text>
    <circle cx="310" cy="130" r="20" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <text x="310" y="135" fill="#f8fafc" text-anchor="middle">3</text>

    <line x1="75" y1="145" x2="45" y2="205" stroke="#94a3b8" stroke-width="2"/>
    <line x1="105" y1="145" x2="135" y2="205" stroke="#94a3b8" stroke-width="2"/>

    <circle cx="35" cy="220" r="18" fill="#1e1b4b" stroke="#334155"/>
    <text x="35" y="225" fill="#f8fafc" text-anchor="middle">4</text>
    <circle cx="145" cy="220" r="18" fill="#1e1b4b" stroke="#334155"/>
    <text x="145" y="225" fill="#f8fafc" text-anchor="middle">5</text>
  </g>

  <rect x="520" y="80" width="320" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="680" y="115" fill="#facc15" font-size="16" font-weight="bold" text-anchor="middle">3 Điều Kiện Tương Đương</text>
  <text x="545" y="150" fill="#f8fafc" font-size="13">Đồ thị G = (V, E) là một Cây khi thỏa:</text>
  <text x="545" y="180" fill="#4ade80" font-size="13">1. G liên thông và có đúng N-1 cạnh</text>
  <text x="545" y="210" fill="#4ade80" font-size="13">2. G không có chu trình và có N-1 cạnh</text>
  <text x="545" y="240" fill="#4ade80" font-size="13">3. Giữa 2 đỉnh bất kỳ có duy nhất 1 đường đi</text>
  <text x="545" y="280" fill="#94a3b8" font-size="12">Áp dụng: Duyệt Cây bằng DFS từ gốc không cần mảng visited, chỉ cần if (v != parent).</text>
</svg>
