<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">MÔ HÌNH HÓA ĐỒ THỊ LƯỚI 2D &amp; MẢNG HƯỚNG DI CHUYỂN DX / DY</text>

  <!-- 4 directions diagram -->
  <g transform="translate(150, 100)">
    <!-- Center cell -->
    <rect x="90" y="90" width="80" height="80" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="135" fill="#38bdf8" font-weight="bold" font-size="14" text-anchor="middle">(r, c)</text>

    <!-- Up -->
    <rect x="90" y="0" width="80" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="40" fill="#f8fafc" font-size="13" text-anchor="middle">(r-1, c)</text>
    <!-- Down -->
    <rect x="90" y="190" width="80" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="230" fill="#f8fafc" font-size="13" text-anchor="middle">(r+1, c)</text>
    <!-- Left -->
    <rect x="0" y="90" width="70" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="135" fill="#f8fafc" font-size="13" text-anchor="middle">(r, c-1)</text>
    <!-- Right -->
    <rect x="190" y="90" width="70" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="225" y="135" fill="#f8fafc" font-size="13" text-anchor="middle">(r, c+1)</text>
  </g>

  <!-- Code vector -->
  <rect x="480" y="90" width="340" height="230" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="650" y="125" fill="#4ade80" font-size="16" font-weight="bold" text-anchor="middle">Mảng Hướng Chuẩn Mực C++</text>
  <text x="505" y="165" fill="#facc15" font-family="monospace" font-size="13">const int dr[] = {-1, 1, 0, 0};</text>
  <text x="505" y="195" fill="#facc15" font-family="monospace" font-size="13">const int dc[] = {0, 0, -1, 1};</text>
  <text x="505" y="235" fill="#f8fafc" font-family="monospace" font-size="12">for (int d = 0; d &lt; 4; ++d) {</text>
  <text x="525" y="260" fill="#f8fafc" font-family="monospace" font-size="12">  int nr = r + dr[d], nc = c + dc[d];</text>
  <text x="525" y="285" fill="#f8fafc" font-family="monospace" font-size="12">  if (isValid(nr, nc)) ...</text>
  <text x="505" y="310" fill="#f8fafc" font-family="monospace" font-size="12">}</text>
</svg>
