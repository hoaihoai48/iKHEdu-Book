<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="400" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">SỐ HỌC DỮ LIỆU CỰC LỚN: CHỌN VŨ KHÍ NÀO?</text>
  <text x="500" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Phân định rõ ràng giữa bài toán yêu cầu số dư (Modulo) và bài toán giá trị chính xác (BigInt)</text>
  <g transform="translate(80, 110)" filter="url(#cardShadow)">
    <rect width="400" height="260" rx="12" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <text x="200" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. MODULO ARITHMETIC (Chuyên đề 08)</text>
    <text x="200" y="58" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Khi đề bài yêu cầu: "In ra kết quả mod 10^9+7"</text>
    <text x="40" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">• Giữ giá trị luôn trong giới hạn kiểu long long</text>
    <text x="40" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">• Tốc độ cực đại O(1) và O(log N) bằng phần cứng CPU</text>
    <text x="40" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">• Dùng cho bài toán đếm tổ hợp C(N, K), quy hoạch động</text>
    <text x="200" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Ưu tiên số 1 khi có modulo!</text>
  </g>
  <g transform="translate(520, 110)" filter="url(#cardShadow)">
    <rect width="400" height="260" rx="12" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber)" />
    <text x="200" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. BIG INTEGER (Chuyên đề 09)</text>
    <text x="200" y="58" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Khi đề bài yêu cầu: "Giá trị chính xác tuyệt đối"</text>
    <text x="40" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">• Mô phỏng đặt tính trên string / vector&lt;int&gt;</text>
    <text x="40" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">• Tính chính xác 1000!, Fibonacci F(1000), 2^10000</text>
    <text x="40" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">• Độ phức tạp cộng O(L), nhân O(L^2) hoặc Base 10^9</text>
    <text x="200" y="215" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Bắt buộc khi không có modulo!</text>
  </g>

</svg>