<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="420" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">So Sánh Chiến Lược Duyệt Đồ Thị: BFS vs DFS</text>
  <text x="40" y="62" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Duyệt theo chiều rộng (theo từng lớp bán kính sóng nước) so với duyệt theo chiều sâu (đi kịch đường một nhánh)</text>

  <!-- Two Cards: BFS vs DFS with Visual Traversal Sub-diagrams -->
  <g transform="translate(40, 85)">
    <!-- BFS Card -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="405" height="310" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
      <text x="25" y="30" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">1. BFS: Duyệt Chiều Rộng (Hàng Đợi - Queue)</text>
      
      <!-- Sub-diagram: BFS tree with level rings -->
      <g transform="translate(25, 42)">
        <rect width="355" height="120" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
        
        <!-- Edges -->
        <line x1="177" y1="22" x2="97" y2="58" stroke="#94A3B8" stroke-width="2"/>
        <line x1="177" y1="22" x2="257" y2="58" stroke="#94A3B8" stroke-width="2"/>
        <line x1="97" y1="58" x2="67" y2="94" stroke="#94A3B8" stroke-width="2"/>
        <line x1="97" y1="58" x2="127" y2="94" stroke="#94A3B8" stroke-width="2"/>

        <!-- Root Node 1 (Level 0) -->
        <circle cx="177" cy="22" r="14" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <text x="177" y="27" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <rect x="205" y="12" width="70" height="18" rx="4" fill="#E0F2FE" stroke="#38BDF8"/>
        <text x="240" y="25" fill="#0369A1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Lớp d = 0</text>

        <!-- Level 1 Nodes: 2, 3 -->
        <circle cx="97" cy="58" r="13" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>
        <text x="97" y="62" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2</text>
        <circle cx="257" cy="58" r="13" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>
        <text x="257" y="62" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">3</text>
        <rect x="280" y="50" width="65" height="18" rx="4" fill="#E0F2FE" stroke="#38BDF8"/>
        <text x="312" y="63" fill="#0369A1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Lớp d = 1</text>

        <!-- Level 2 Nodes: 4, 5 -->
        <circle cx="67" cy="94" r="12" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
        <text x="67" y="98" fill="#0369A1" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">4</text>
        <circle cx="127" cy="94" r="12" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
        <text x="127" y="98" fill="#0369A1" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">5</text>
        <text x="250" y="100" fill="#059669" font-family="monospace" font-size="11" font-weight="700">Thứ tự: 1 ➔ 2, 3 ➔ 4, 5</text>
      </g>

      <!-- Characteristics Box -->
      <g transform="translate(25, 172)">
        <text x="0" y="18" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• <tspan font-weight="700">Cấu trúc:</tspan> std::queue&lt;int&gt; q;</text>
        <text x="0" y="42" fill="#059669" font-family="system-ui, sans-serif" font-size="12.5">• <tspan font-weight="700">Điểm mạnh:</tspan> Tìm đường đi ngắn nhất (trọng số bằng nhau)</text>
        <text x="0" y="66" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• <tspan font-weight="700">Độ phức tạp:</tspan> O(V + E) thời gian và O(V) bộ nhớ</text>
        <rect y="82" width="355" height="34" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="15" y="104" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Ứng dụng: Loang lưới, tìm số bước ít nhất, cây BFS.</text>
      </g>
    </g>

    <!-- DFS Card -->
    <g transform="translate(435, 0)" filter="url(#cardShadow)">
      <rect width="405" height="310" rx="12" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
      <text x="25" y="30" fill="#7E22CE" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">2. DFS: Duyệt Chiều Sâu (Đệ Quy / Ngăn Xếp)</text>
      
      <!-- Sub-diagram: DFS tree with branch depth -->
      <g transform="translate(25, 42)">
        <rect width="355" height="120" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
        
        <!-- Edges -->
        <line x1="177" y1="22" x2="97" y2="58" stroke="#94A3B8" stroke-width="2"/>
        <line x1="177" y1="22" x2="257" y2="58" stroke="#94A3B8" stroke-width="2"/>
        <line x1="97" y1="58" x2="67" y2="94" stroke="#94A3B8" stroke-width="2"/>
        <line x1="97" y1="58" x2="127" y2="94" stroke="#94A3B8" stroke-width="2"/>

        <!-- Root Node 1 -->
        <circle cx="177" cy="22" r="14" fill="#9333EA" stroke="#7E22CE" stroke-width="1.5"/>
        <text x="177" y="27" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">1</text>

        <!-- Node 2 (visited 2nd) -->
        <circle cx="97" cy="58" r="13" fill="#C084FC" stroke="#9333EA" stroke-width="1.5"/>
        <text x="97" y="62" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2</text>

        <!-- Node 4 (visited 3rd - deep plunge) -->
        <circle cx="67" cy="94" r="12" fill="#E9D5FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="67" y="98" fill="#7E22CE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">3</text>

        <!-- Node 5 (visited 4th - backtrack) -->
        <circle cx="127" cy="94" r="12" fill="#E9D5FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="127" y="98" fill="#7E22CE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">4</text>

        <!-- Node 3 (visited 5th) -->
        <circle cx="257" cy="58" r="13" fill="#E9D5FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="257" y="62" fill="#7E22CE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">5</text>

        <rect x="160" y="85" width="180" height="24" rx="4" fill="#F3E8FF" stroke="#D8B4FE"/>
        <text x="250" y="101" fill="#7E22CE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Thứ tự đi sâu: 1➔2➔3➔4➔5</text>
      </g>

      <!-- Characteristics Box -->
      <g transform="translate(25, 172)">
        <text x="0" y="18" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• <tspan font-weight="700">Cấu trúc:</tspan> Hàm đệ quy dfs(u) hoặc std::stack</text>
        <text x="0" y="42" fill="#7E22CE" font-family="system-ui, sans-serif" font-size="12.5">• <tspan font-weight="700">Điểm mạnh:</tspan> Tìm thành phần liên thông, chu trình, khớp/cầu</text>
        <text x="0" y="66" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• <tspan font-weight="700">Độ phức tạp:</tspan> O(V + E) thời gian và O(V) stack gọi hàm</text>
        <rect y="82" width="355" height="34" rx="6" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
        <text x="15" y="104" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Ứng dụng: Đếm miền, Topo sort, Euler, Quay lui đồ thị.</text>
      </g>
    </g>
  </g>
</svg>
