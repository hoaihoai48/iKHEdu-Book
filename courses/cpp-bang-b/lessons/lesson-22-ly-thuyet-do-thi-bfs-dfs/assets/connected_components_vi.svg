<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="900" height="380" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16"/>
  <text x="450" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ĐẾM SỐ THÀNH PHẦN LIÊN THÔNG TRÊN ĐỒ THỊ VÔ HƯỚNG</text>

  <!-- Component 1 -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" stroke-dasharray="4"/>
    <text x="110" y="30" fill="#0369A1" font-weight="bold" text-anchor="middle">Thành phần 1</text>
    <circle cx="60" cy="80" r="18" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="60" y="85" fill="#1E293B" text-anchor="middle">1</text>
    <circle cx="160" cy="80" r="18" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="160" y="85" fill="#1E293B" text-anchor="middle">2</text>
    <circle cx="110" cy="150" r="18" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="110" y="155" fill="#1E293B" text-anchor="middle">3</text>
    <line x1="78" y1="80" x2="142" y2="80" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="98" x2="100" y2="135" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Component 2 -->
  <g transform="translate(340, 90)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" stroke-dasharray="4"/>
    <text x="110" y="30" fill="#065F46" font-weight="bold" text-anchor="middle">Thành phần 2</text>
    <circle cx="60" cy="110" r="18" fill="#D1FAE5" stroke="#059669"/>
    <text x="60" y="115" fill="#1E293B" text-anchor="middle">4</text>
    <circle cx="160" cy="110" r="18" fill="#D1FAE5" stroke="#059669"/>
    <text x="160" y="115" fill="#1E293B" text-anchor="middle">5</text>
    <line x1="78" y1="110" x2="142" y2="110" stroke="#4ade80" stroke-width="2"/>
  </g>

  <!-- Component 3 -->
  <g transform="translate(600, 90)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4"/>
    <text x="110" y="30" fill="#92400E" font-weight="bold" text-anchor="middle">Thành phần 3 (Đỉnh cô lập)</text>
    <circle cx="110" cy="110" r="18" fill="#FEF3C7" stroke="#D97706"/>
    <text x="110" y="115" fill="#1E293B" text-anchor="middle">6</text>
  </g>

  <text x="450" y="335" fill="#1E293B" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">Duyệt mọi đỉnh i = 1..N: Nếu !visited[i] → count++, gọi DFS(i) hoặc BFS(i) loang hết thành phần.</text>
</svg>
