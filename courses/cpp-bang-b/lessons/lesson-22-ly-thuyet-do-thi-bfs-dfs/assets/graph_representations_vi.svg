<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="900" height="380" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16"/>
  <text x="450" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">BIỂU DIỄN ĐỒ THỊ: MA TRẬN KỀ VS DANH SÁCH KỀ (ADJACENCY LIST)</text>

  <rect x="50" y="70" width="380" height="280" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="240" y="105" fill="#B91C1C" font-size="16" font-weight="bold" text-anchor="middle">Ma Trận Kề: adj[N][N]</text>
  <text x="75" y="140" fill="#475569" font-family="monospace" font-size="13">int adj[1005][1005];</text>
  <text x="75" y="170" fill="#1E293B" font-size="13">• Kiểm tra cạnh (u, v): O(1)</text>
  <text x="75" y="200" fill="#B91C1C" font-size="13">• Bộ nhớ: O(N^2) → Sập bộ nhớ khi N=10^5</text>
  <text x="75" y="230" fill="#B91C1C" font-size="13">• Duyệt đỉnh kề: O(N)</text>
  <text x="75" y="270" fill="#475569" font-size="13">→ Chỉ dùng khi N ≤ 1000 hoặc đồ thị dày</text>

  <rect x="470" y="70" width="380" height="280" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="660" y="105" fill="#065F46" font-size="16" font-weight="bold" text-anchor="middle">Danh Sách Kề: vector&lt;int&gt; adj[N]</text>
  <text x="495" y="140" fill="#065F46" font-family="monospace" font-size="13">vector&lt;int&gt; adj[100005];</text>
  <text x="495" y="170" fill="#065F46" font-size="13">• Bộ nhớ: O(N + M) tối ưu tuyệt đối</text>
  <text x="495" y="200" fill="#065F46" font-size="13">• Duyệt đỉnh kề: O(deg(u)) cực nhanh</text>
  <text x="495" y="230" fill="#1E293B" font-size="13">• Thêm cạnh: adj[u].push_back(v) trong O(1)</text>
  <text x="495" y="270" fill="#92400E" font-size="13">→ Chuẩn mực thi đấu Olympic cho N, M ≤ 10^5</text>
</svg>
