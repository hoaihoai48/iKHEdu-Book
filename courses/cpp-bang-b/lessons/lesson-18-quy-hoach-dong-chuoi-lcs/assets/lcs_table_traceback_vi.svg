  <g transform="translate(100, 350)" filter="url(#cardShadow)">
    <rect width="800" height="125" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="30" y="30" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">QUY TẮC TRUY VẾT (TRACEBACK) TRÊN BẢNG LCS:</text>
    <text x="30" y="55" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Nếu A[i] == B[j]: Ký tự này thuộc LCS ➔ Ghi nhận ký tự và đi chéo lùi về (i-1, j-1).</text>
    <text x="30" y="80" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Nếu A[i] != B[j]: Đi theo hướng có giá trị lớn hơn: lên trên (i-1, j) hoặc sang trái (i, j-1).</text>
    <text x="30" y="105" fill="#059669" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold">➔ Ô xanh lá là đường truy vết "GTAB", ô đậm là ký tự khớp (B, A, T, G).</text>
  </g>
</svg>