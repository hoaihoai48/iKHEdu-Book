<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0284C7" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#D97706" /></marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="45" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">MÔ HÌNH THUẬT TOÁN CHIA ĐỂ TRỊ (DIVIDE &amp; CONQUER)</text>
  <text x="500" y="75" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">3 Pha Chuẩn Mực: Phân Chia (Divide) ➔ Đệ Quy Giải Quyết (Solve) ➔ Tổng Hợp Nghiệm (Combine)</text>

  <!-- Level 0: Root Problem -->
  <g transform="translate(350, 110)" filter="url(#cardShadow)">
    <rect width="300" height="70" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="150" y="32" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">BÀI TOÁN GỐC QUY MÔ N</text>
    <text x="150" y="54" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Kích thước dữ liệu ban đầu cần xử lý</text>
  </g>

  <!-- Divide arrows -->
  <path d="M 430 180 L 280 235" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowCyan)" />
  <path d="M 570 180 L 720 235" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowCyan)" />

  <rect x="290" y="190" width="140" height="26" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
  <text x="360" y="207" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PHÂN CHIA (N/2)</text>

  <rect x="570" y="190" width="140" height="26" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
  <text x="640" y="207" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PHÂN CHIA (N/2)</text>

  <!-- Level 1: Subproblems -->
  <g transform="translate(130, 245)" filter="url(#cardShadow)">
    <rect width="280" height="65" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="140" y="28" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BÀI TOÁN CON 1 (NỬA TRÁI)</text>
    <text x="140" y="48" fill="#0284C7" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Quy mô thu nhỏ N/2</text>
  </g>
  <g transform="translate(590, 245)" filter="url(#cardShadow)">
    <rect width="280" height="65" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="140" y="28" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BÀI TOÁN CON 2 (NỬA PHẢI)</text>
    <text x="140" y="48" fill="#0284C7" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Quy mô thu nhỏ N/2</text>
  </g>

  <!-- Solve arrows -->
  <path d="M 270 310 L 270 365" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <path d="M 730 310 L 730 365" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <text x="210" y="342" fill="#065F46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">ĐỆ QUY GIẢI</text>
  <text x="790" y="342" fill="#065F46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">ĐỆ QUY GIẢI</text>

  <!-- Level 2: Sub-solutions -->
  <g transform="translate(140, 375)" filter="url(#cardShadow)">
    <rect width="260" height="60" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <text x="130" y="26" fill="#065F46" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">ĐÁP ÁN BÀI TOÁN CON 1</text>
    <text x="130" y="46" fill="#047857" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Kết quả tối ưu nửa trái</text>
  </g>
  <g transform="translate(600, 375)" filter="url(#cardShadow)">
    <rect width="260" height="60" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <text x="130" y="26" fill="#065F46" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">ĐÁP ÁN BÀI TOÁN CON 2</text>
    <text x="130" y="46" fill="#047857" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Kết quả tối ưu nửa phải</text>
  </g>

  <!-- Combine arrows -->
  <path d="M 270 435 L 430 490" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrowAmber)" />
  <path d="M 730 435 L 570 490" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrowAmber)" />
  <text x="320" y="475" fill="#B45309" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GỘP KẾT QUẢ</text>
  <text x="680" y="475" fill="#B45309" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GỘP KẾT QUẢ</text>

  <!-- Level 3: Global Solution -->
  <g transform="translate(330, 495)" filter="url(#cardShadow)">
    <rect width="340" height="75" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
    <text x="170" y="32" fill="#92400E" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">LỜI GIẢI TOÀN CỤC BÀI TOÁN GỐC (N)</text>
    <text x="170" y="55" fill="#B45309" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Độ phức tạp: T(N) = 2T(N/2) + O(Combine)</text>
  </g>
</svg>