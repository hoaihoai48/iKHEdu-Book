<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" rx="16" fill="url(#bgGrad6)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="30" y="42" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Trực quan hóa cấu trúc Bit &amp; 4 Thao tác Bit trên N = 13 (1101₂)</text>
  <text x="30" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Biểu diễn 5-bit: Bit 0 (LSB) nằm bên phải cùng, Bit 4 (MSB) nằm bên trái cùng.</text>

  <!-- Bit Array representation of N = 13 -->
  <g transform="translate(180, 95)">
    <!-- Bit 4 -->
    <g transform="translate(0, 0)">
      <rect width="100" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="50" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Bit 4 (2⁴=16)</text>
      <text x="50" y="58" fill="#64748b" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">0</text>
    </g>
    <!-- Bit 3 -->
    <g transform="translate(110, 0)">
      <rect width="100" height="75" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
      <text x="50" y="24" fill="#93c5fd" font-family="sans-serif" font-size="11" text-anchor="middle">Bit 3 (2³=8)</text>
      <text x="50" y="58" fill="#60a5fa" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <!-- Bit 2 -->
    <g transform="translate(220, 0)">
      <rect width="100" height="75" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
      <text x="50" y="24" fill="#93c5fd" font-family="sans-serif" font-size="11" text-anchor="middle">Bit 2 (2²=4)</text>
      <text x="50" y="58" fill="#60a5fa" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <!-- Bit 1 -->
    <g transform="translate(330, 0)">
      <rect width="100" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="50" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Bit 1 (2¹=2)</text>
      <text x="50" y="58" fill="#64748b" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">0</text>
    </g>
    <!-- Bit 0 -->
    <g transform="translate(440, 0)">
      <rect width="100" height="75" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
      <text x="50" y="24" fill="#93c5fd" font-family="sans-serif" font-size="11" text-anchor="middle">Bit 0 (2⁰=1)</text>
      <text x="50" y="58" fill="#60a5fa" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- 4 Core Operations Grid -->
  <g transform="translate(30, 195)">
    <!-- Op 1: Check Bit -->
    <g transform="translate(0, 0)">
      <rect width="405" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="18" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">1. Kiểm Tra Bit k = 2</text>
      <rect x="250" y="12" width="140" height="24" rx="4" fill="#0369a1"/>
      <text x="320" y="28" fill="#f0f9ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">(n &gt;&gt; k) &amp; 1</text>
      <text x="18" y="55" fill="#cbd5e1" font-family="sans-serif" font-size="12">Phép tính: (1101₂ &gt;&gt; 2) &amp; 0001₂ = 0011₂ &amp; 0001₂</text>
      <text x="18" y="78" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">➜ Kết quả: 1 (Bit 2 đang BẬT - true)</text>
    </g>

    <!-- Op 2: Set Bit -->
    <g transform="translate(435, 0)">
      <rect width="405" height="95" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="18" y="28" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">2. Bật Bit k = 1</text>
      <rect x="250" y="12" width="140" height="24" rx="4" fill="#047857"/>
      <text x="320" y="28" fill="#ecfdf5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">n |= (1 &lt;&lt; k)</text>
      <text x="18" y="55" fill="#cbd5e1" font-family="sans-serif" font-size="12">Phép tính: 1101₂ | 0010₂ = 1111₂</text>
      <text x="18" y="78" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">➜ Kết quả: 1111₂ (Giá trị mới: 13 ➜ 15)</text>
    </g>

    <!-- Op 3: Clear Bit -->
    <g transform="translate(0, 110)">
      <rect width="405" height="95" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="18" y="28" fill="#fb7185" font-family="sans-serif" font-size="14" font-weight="bold">3. Tắt Bit k = 3</text>
      <rect x="250" y="12" width="140" height="24" rx="4" fill="#be123c"/>
      <text x="320" y="28" fill="#fff1f2" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">n &amp;= ~(1 &lt;&lt; k)</text>
      <text x="18" y="55" fill="#cbd5e1" font-family="sans-serif" font-size="12">Phép tính: 1101₂ &amp; ~(1000₂) = 1101₂ &amp; 0111₂</text>
      <text x="18" y="78" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="bold">➜ Kết quả: 0101₂ (Giá trị mới: 13 ➜ 5)</text>
    </g>

    <!-- Op 4: Toggle Bit -->
    <g transform="translate(435, 110)">
      <rect width="405" height="95" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="18" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold">4. Đảo Bit k = 0</text>
      <rect x="250" y="12" width="140" height="24" rx="4" fill="#7e22ce"/>
      <text x="320" y="28" fill="#faf5ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">n ^= (1 &lt;&lt; k)</text>
      <text x="18" y="55" fill="#cbd5e1" font-family="sans-serif" font-size="12">Phép tính: 1101₂ ^ 0001₂ = 1100₂</text>
      <text x="18" y="78" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">➜ Kết quả: 1100₂ (Giá trị mới: 13 ➜ 12)</text>
    </g>
  </g>
</svg>