<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="420" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="30" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Trực quan hóa cấu trúc Bit &amp; 4 Thao tác Bit trên N = 13 (1101₂)</text>
  <text x="30" y="68" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Biểu diễn 5-bit: Bit 0 (LSB) nằm bên phải cùng, Bit 4 (MSB) nằm bên trái cùng.</text>

  <!-- Bit Array representation of N = 13 -->
  <g transform="translate(180, 95)">
    <!-- Bit 4 (0 - TẮT) -->
    <g transform="translate(0, 0)">
      <rect width="100" height="75" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="50" y="24" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bit 4 (2⁴=16)</text>
      <text x="50" y="58" fill="#475569" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">0</text>
    </g>
    <!-- Bit 3 (1 - BẬT) -->
    <g transform="translate(110, 0)">
      <rect width="100" height="75" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="50" y="24" fill="#1E40AF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bit 3 (2³=8)</text>
      <text x="50" y="58" fill="#1D4ED8" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <!-- Bit 2 (1 - BẬT) -->
    <g transform="translate(220, 0)">
      <rect width="100" height="75" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="50" y="24" fill="#1E40AF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bit 2 (2²=4)</text>
      <text x="50" y="58" fill="#1D4ED8" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <!-- Bit 1 (0 - TẮT) -->
    <g transform="translate(330, 0)">
      <rect width="100" height="75" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="50" y="24" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bit 1 (2¹=2)</text>
      <text x="50" y="58" fill="#475569" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">0</text>
    </g>
    <!-- Bit 0 (1 - BẬT) -->
    <g transform="translate(440, 0)">
      <rect width="100" height="75" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="50" y="24" fill="#1E40AF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bit 0 (2⁰=1)</text>
      <text x="50" y="58" fill="#1D4ED8" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- 4 Core Operations Grid -->
  <g transform="translate(30, 195)">
    <!-- Op 1: Check Bit -->
    <g transform="translate(0, 0)">
      <rect width="405" height="95" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
      <text x="18" y="28" fill="#0369A1" font-family="sans-serif" font-size="14" font-weight="bold">1. Kiểm Tra Bit k = 2</text>
      <rect x="250" y="10" width="140" height="26" rx="5" fill="#BAE6FD" stroke="#38BDF8" stroke-width="1"/>
      <text x="320" y="27" fill="#0369A1" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">(n &gt;&gt; k) &amp; 1</text>
      <text x="18" y="56" fill="#334155" font-family="sans-serif" font-size="12">Phép tính: (1101₂ &gt;&gt; 2) &amp; 0001₂ = 0011₂ &amp; 0001₂</text>
      <text x="18" y="80" fill="#15803D" font-family="sans-serif" font-size="12.5" font-weight="bold">➜ Kết quả: 1 (Bit 2 đang BẬT - true)</text>
    </g>

    <!-- Op 2: Set Bit -->
    <g transform="translate(435, 0)">
      <rect width="405" height="95" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="18" y="28" fill="#065F46" font-family="sans-serif" font-size="14" font-weight="bold">2. Bật Bit k = 1</text>
      <rect x="250" y="10" width="140" height="26" rx="5" fill="#A7F3D0" stroke="#34D399" stroke-width="1"/>
      <text x="320" y="27" fill="#065F46" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">n |= (1 &lt;&lt; k)</text>
      <text x="18" y="56" fill="#334155" font-family="sans-serif" font-size="12">Phép tính: 1101₂ | 0010₂ = 1111₂</text>
      <text x="18" y="80" fill="#047857" font-family="sans-serif" font-size="12.5" font-weight="bold">➜ Kết quả: 1111₂ (Giá trị mới: 13 ➜ 15)</text>
    </g>

    <!-- Op 3: Clear Bit -->
    <g transform="translate(0, 110)">
      <rect width="405" height="95" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="18" y="28" fill="#991B1B" font-family="sans-serif" font-size="14" font-weight="bold">3. Tắt Bit k = 3</text>
      <rect x="250" y="10" width="140" height="26" rx="5" fill="#FECDD3" stroke="#F43F5E" stroke-width="1"/>
      <text x="320" y="27" fill="#991B1B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">n &amp;= ~(1 &lt;&lt; k)</text>
      <text x="18" y="56" fill="#334155" font-family="sans-serif" font-size="12">Phép tính: 1101₂ &amp; ~(1000₂) = 1101₂ &amp; 0111₂</text>
      <text x="18" y="80" fill="#B91C1C" font-family="sans-serif" font-size="12.5" font-weight="bold">➜ Kết quả: 0101₂ (Giá trị mới: 13 ➜ 5)</text>
    </g>

    <!-- Op 4: Toggle Bit -->
    <g transform="translate(435, 110)">
      <rect width="405" height="95" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
      <text x="18" y="28" fill="#6B21A8" font-family="sans-serif" font-size="14" font-weight="bold">4. Đảo Bit k = 0</text>
      <rect x="250" y="10" width="140" height="26" rx="5" fill="#E9D5FF" stroke="#C084FC" stroke-width="1"/>
      <text x="320" y="27" fill="#6B21A8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">n ^= (1 &lt;&lt; k)</text>
      <text x="18" y="56" fill="#334155" font-family="sans-serif" font-size="12">Phép tính: 1101₂ ^ 0001₂ = 1100₂</text>
      <text x="18" y="80" fill="#7E22CE" font-family="sans-serif" font-size="12.5" font-weight="bold">➜ Kết quả: 1100₂ (Giá trị mới: 13 ➜ 12)</text>
    </g>
  </g>
</svg>