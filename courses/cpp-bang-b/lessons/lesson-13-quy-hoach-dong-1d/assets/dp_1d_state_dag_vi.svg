<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="360" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">MÔ HÌNH ĐỒ THỊ TRẠNG THÁI DAG QUY HOẠCH ĐỘNG 1D</text>
  <text x="500" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Thứ tự tính toán Topo (Evaluation Order): Trạng thái con được tính trước làm tiền đề cho trạng thái lớn hơn</text>

  <!-- Node 0 -->
  <g transform="translate(80, 140)">
    <circle cx="35" cy="35" r="30" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <text x="35" y="41" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">dp[0]</text>
    <text x="35" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Base Case</text>
  </g>

  <!-- Node 1 -->
  <g transform="translate(260, 140)">
    <circle cx="35" cy="35" r="30" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" />
    <text x="35" y="41" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">dp[1]</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(440, 140)">
    <circle cx="35" cy="35" r="30" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" />
    <text x="35" y="41" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">dp[2]</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(620, 140)">
    <circle cx="35" cy="35" r="30" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" />
    <text x="35" y="41" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">dp[3]</text>
  </g>

  <!-- Node N -->
  <g transform="translate(800, 140)">
    <circle cx="35" cy="35" r="30" fill="url(#greenCard)" stroke="#10b981" stroke-width="2.5" filter="url(#glowGreen)" />
    <text x="35" y="41" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">dp[N]</text>
    <text x="35" y="85" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Đáp Án Cuối</text>
  </g>

  <!-- Edges -->
  <path d="M 145 175 L 255 175" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 325 175 L 435 175" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 505 175 L 615 175" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 685 175 L 795 175" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />

  <!-- Jump edges (Step 2) -->
  <path d="M 125 145 Q 295 90 465 145" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
  <path d="M 305 145 Q 475 90 645 145" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
  <path d="M 485 145 Q 655 90 825 145" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />

  <!-- Legend Card -->
  <g transform="translate(100, 260)" filter="url(#cardShadow)">
    <rect width="800" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Chiều duyệt vòng lặp (i = 1 ➔ N):</text>
    <text x="30" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Đảm bảo dp[i-1] và dp[i-2] đã có giá trị chính xác trước khi tính dp[i] = dp[i-1] + dp[i-2]</text>
  </g>

</svg>