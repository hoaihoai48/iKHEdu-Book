<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="360" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">MÔ HÌNH DÃY CON TĂNG DÀI NHẤT (LIS O(N²)) &amp; TRUY VẾT</text>
  <text x="500" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Bất biến Trạng thái: dp[i] là độ dài LIS kết thúc BẮT BUỘC tại A[i]</text>

  <!-- Array A -->
  <g transform="translate(80, 100)">
    <text x="0" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Mảng A:</text>
    <g transform="translate(90, 0)">
      <rect x="0" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="35" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">10</text>
      <rect x="80" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="115" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">22</text>
      <rect x="160" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="195" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">9</text>
      <rect x="240" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="275" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">33</text>
      <rect x="320" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="355" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">21</text>
      <rect x="400" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="435" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">50</text>
      <rect x="480" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="515" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">41</text>
      <rect x="560" width="70" height="40" rx="6" fill="#1e293b" stroke="#64748b" /><text x="595" y="26" fill="#f8fafc" font-family="monospace" font-size="15" text-anchor="middle">60</text>
    </g>
  </g>

  <!-- Array DP -->
  <g transform="translate(80, 160)">
    <text x="0" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Mảng dp:</text>
    <g transform="translate(90, 0)">
      <rect x="0" width="70" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" /><text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">1</text>
      <rect x="80" width="70" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" /><text x="115" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">2</text>
      <rect x="160" width="70" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" /><text x="195" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">1</text>
      <rect x="240" width="70" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" /><text x="275" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">3</text>
      <rect x="320" width="70" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" /><text x="355" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">2</text>
      <rect x="400" width="70" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" /><text x="435" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">4</text>
      <rect x="480" width="70" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" /><text x="515" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">4</text>
      <rect x="560" width="70" height="40" rx="6" fill="url(#greenCard)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" /><text x="595" y="26" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    </g>
  </g>

  <!-- Traceback Path -->
  <path d="M 725 180 Q 645 130 565 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 565 180 Q 405 130 405 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 405 180 Q 245 130 245 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 245 180 Q 125 130 125 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Legend Bottom -->
  <g transform="translate(100, 240)" filter="url(#cardShadow)">
    <rect width="800" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold">Khôi phục chuỗi LIS tối ưu: [10 ➔ 22 ➔ 33 ➔ 50 ➔ 60] (Độ dài = 5)</text>
    <text x="30" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Công thức chuyển: dp[i] = 1 + max({dp[j] | 0 &lt;= j &lt; i và A[j] &lt; A[i]})</text>
  </g>

</svg>