<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748B" flood-opacity="0.12" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="350" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />
  

  
  <text x="500" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">BÀI TOÁN ĐỔI TIỀN (COIN CHANGE 1D) &amp; DAG TRẠNG THÁI</text>
  <text x="500" y="65" fill="#475569" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Mệnh giá xu: C = {1, 3, 4} | dp[S] = Số đồng xu ít nhất để tạo ra tổng S</text>

  <!-- DP table nodes for S = 0..6 -->
  <g transform="translate(100, 110)">
    <!-- S=0 -->
    <g transform="translate(0, 0)">
      <rect width="90" height="55" rx="8" fill="url(#greenCard)" stroke="#10b981" stroke-width="2" />
      <text x="45" y="24" fill="#065F46" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">S = 0</text>
      <text x="45" y="45" fill="#065F46" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">0 xu</text>
    </g>
    <!-- S=1 -->
    <g transform="translate(130, 0)">
      <rect width="90" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" />
      <text x="45" y="24" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">S = 1</text>
      <text x="45" y="45" fill="#0F172A" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1 xu</text>
    </g>
    <!-- S=2 -->
    <g transform="translate(260, 0)">
      <rect width="90" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" />
      <text x="45" y="24" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">S = 2</text>
      <text x="45" y="45" fill="#0F172A" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">2 xu</text>
    </g>
    <!-- S=3 -->
    <g transform="translate(390, 0)">
      <rect width="90" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" />
      <text x="45" y="24" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">S = 3</text>
      <text x="45" y="45" fill="#0F172A" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1 xu</text>
    </g>
    <!-- S=4 -->
    <g transform="translate(520, 0)">
      <rect width="90" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" />
      <text x="45" y="24" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">S = 4</text>
      <text x="45" y="45" fill="#0F172A" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1 xu</text>
    </g>
    <!-- S=6 -->
    <g transform="translate(670, 0)" filter="url(#glowAmber)">
      <rect width="110" height="55" rx="8" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="2" />
      <text x="55" y="24" fill="#92400E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">S = 6 (Target)</text>
      <text x="55" y="45" fill="#065F46" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">2 xu (3+3)</text>
    </g>
  </g>

  <!-- Transitions to S=6 -->
  <path d="M 525 165 Q 640 215 725 165" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
  <text x="630" y="210" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Dùng xu 3 (từ S=3)</text>

  <path d="M 655 165 Q 690 200 735 165" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <text x="700" y="195" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11.5">Dùng xu 4 (từ S=2)</text>

  <!-- Card Formula -->
  <g transform="translate(100, 240)" filter="url(#cardShadow)">
    <rect width="800" height="75" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="30" y="32" fill="#fbbf24" font-family="monospace" font-size="13.5" font-weight="bold">dp[S] = 1 + min({dp[S - c] | c in C và S >= c})</text>
    <text x="30" y="56" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Khởi tạo dp[0] = 0, mọi dp[i] = INF. Cắt tỉa nhánh không thể đổi được khi dp[S] == INF.</text>
  </g>

</svg>