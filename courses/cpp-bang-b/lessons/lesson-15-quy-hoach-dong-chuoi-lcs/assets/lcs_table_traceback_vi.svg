<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="350" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="350" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">BẢNG PHƯƠNG ÁN LCS &amp; ĐƯỜNG TRUY VẾT XÂU TỐI ƯU</text>
  <text x="500" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Xâu A = "AGGTAB", Xâu B = "GXTXAYB" ➔ LCS = "GTAB" (Độ dài = 4)</text>

  <!-- Mini Grid Visualization -->
  <g transform="translate(180, 100)">
    <!-- Headers -->
    <rect x="0" y="0" width="640" height="35" rx="6" fill="#1e293b" />
    <text x="40" y="23" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">i \ j</text>
    <text x="110" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">eps</text>
    <text x="180" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">G</text>
    <text x="250" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">X</text>
    <text x="320" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">T</text>
    <text x="390" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">X</text>
    <text x="460" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">A</text>
    <text x="530" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">Y</text>
    <text x="600" y="23" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">B</text>

    <!-- Highlighted Cell (A[i] == B[j]) Diagonal -->
    <g transform="translate(560, 45)" filter="url(#glowGreen)">
      <rect width="70" height="40" rx="6" fill="url(#greenCard)" stroke="#10b981" stroke-width="2" />
      <text x="35" y="26" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">4</text>
      <text x="35" y="-6" fill="#34d399" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">B == B</text>
    </g>
  </g>

  <!-- Traceback explanation card -->
  <g transform="translate(100, 205)" filter="url(#cardShadow)">
    <rect width="800" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">QUY TẮC TRUY VẾT (TRACEBACK) TRÊN BẢNG LCS:</text>
    <text x="30" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Nếu A[i] == B[j]: Ký tự này thuộc LCS ➔ Ghi nhận ký tự và đi chéo lùi về (i-1, j-1).</text>
    <text x="30" y="80" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Nếu A[i] != B[j]: Đi theo hướng có giá trị lớn hơn: lên trên (i-1, j) hoặc sang trái (i, j-1).</text>
    <text x="30" y="105" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold">➔ Kết quả sau khi đảo ngược chuỗi thu được: "GTAB"</text>
  </g>

</svg>