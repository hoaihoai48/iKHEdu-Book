<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.12" />
    </filter>

    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#DC2626" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#D97706" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" /></marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="370" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="45" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">CÂY TÌM KIẾM TRẠNG THÁI: QUAY LUI &amp; NHÁNH CẬN</text>
  <text x="500" y="75" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Phân biệt 2 cơ chế cắt tỉa: Ràng buộc khả thi (Feasibility) vs Tối ưu cận biên (Branch &amp; Bound)</text>

  <!-- Root Circle -->
  <g transform="translate(420, 105)" filter="url(#cardShadow)">
    <circle cx="80" cy="32" r="32" fill="#EFF6FF" stroke="#0284C7" stroke-width="2.5" />
    <text x="80" y="38" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GỐC</text>
  </g>

  <!-- Left Branch: Red Pruning -->
  <path d="M 465 160 L 240 230" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRed)" />
  <g transform="translate(120, 240)" filter="url(#cardShadow)">
    <rect width="240" height="96" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" />
    <text x="120" y="28" fill="#991B1B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CẮT TỈA RÀNG BUỘC</text>
    <text x="120" y="50" fill="#B91C1C" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Feasibility Pruning</text>
    <text x="120" y="74" fill="#1E293B" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Vi phạm điều kiện bài toán ➔ Dừng</text>
  </g>

  <!-- Middle Branch: Amber Bound Pruning -->
  <path d="M 500 170 L 500 230" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowAmber)" />
  <g transform="translate(380, 240)" filter="url(#cardShadow)">
    <rect width="240" height="96" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
    <text x="120" y="28" fill="#92400E" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CẮT TỈA NHÁNH CẬN</text>
    <text x="120" y="50" fill="#B45309" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Optimality Pruning (B&amp;B)</text>
    <text x="120" y="74" fill="#1E293B" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">LB &gt;= best (Không thể tối ưu)</text>
  </g>

  <!-- Right Branch: Green Solution -->
  <path d="M 535 160 L 760 230" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <g transform="translate(640, 240)" filter="url(#cardShadow)">
    <rect width="240" height="96" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
    <text x="120" y="28" fill="#065F46" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ĐI SÂU KHÁM PHÁ</text>
    <text x="120" y="50" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Choose ➔ Explore ➔ Unchoose</text>
    <text x="120" y="74" fill="#065F46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Thu được NGHIỆM TỐI ƯU</text>
  </g>

</svg>