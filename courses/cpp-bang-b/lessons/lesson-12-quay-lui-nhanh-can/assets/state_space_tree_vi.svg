<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="370" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="370" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">CÂY TÌM KIẾM TRẠNG THÁI: QUAY LUI &amp; NHÁNH CẬN</text>
  <text x="500" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Phân biệt 2 cơ chế cắt tỉa: Ràng buộc khả thi (Feasibility) vs Tối ưu cận biên (Branch &amp; Bound)</text>
  <g transform="translate(420, 110)">
    <circle cx="80" cy="30" r="30" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)" />
    <text x="80" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">GỐC</text>
  </g>
  <path d="M 470 165 L 240 230" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />
  <g transform="translate(120, 240)" filter="url(#cardShadow)">
    <rect width="240" height="90" rx="10" fill="url(#redCard)" stroke="#ef4444" stroke-width="2" filter="url(#glowRed)" />
    <text x="120" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">CẮT TỈA RÀNG BUỘC</text>
    <text x="120" y="50" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Feasibility Pruning</text>
    <text x="120" y="72" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Vi phạm điều kiện bài toán ➔ Dừng</text>
  </g>
  <path d="M 500 170 L 500 230" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />
  <g transform="translate(380, 240)" filter="url(#cardShadow)">
    <rect width="240" height="90" rx="10" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber)" />
    <text x="120" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">CẮT TỈA NHÁNH CẬN</text>
    <text x="120" y="50" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Optimality Pruning (B&amp;B)</text>
    <text x="120" y="72" fill="#fde68a" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">LB &gt;= best (Không thể tối ưu)</text>
  </g>
  <path d="M 530 165 L 760 230" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <g transform="translate(640, 240)" filter="url(#cardShadow)">
    <rect width="240" height="90" rx="10" fill="url(#greenCard)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="120" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">ĐI SÂU KHÁM PHÁ</text>
    <text x="120" y="50" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Choose ➔ Explore ➔ Unchoose</text>
    <text x="120" y="72" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Thu được NGHIỆM TỐI ƯU</text>
  </g>

</svg>