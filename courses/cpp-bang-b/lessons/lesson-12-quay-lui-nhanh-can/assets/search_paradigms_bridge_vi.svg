<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.12" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#0284C7" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#7C3AED" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">CẦU NỐI KIẾN TRÚC CÁC PHƯƠNG PHÁP THUẬT TOÁN LỚN</text>
  <text x="500" y="68" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Sự tiến hóa từ Đệ quy cơ bản đến Tìm kiếm không gian trạng thái và Quy hoạch động</text>

  <!-- Top Root: Recursion -->
  <g transform="translate(350, 95)" filter="url(#cardShadow)">
    <rect width="300" height="58" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="150" y="27" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ĐỆ QUY (RECURSION)</text>
    <text x="150" y="46" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Cơ chế điều khiển Call Stack</text>
  </g>

  <!-- Arrow Left (D&C) -->
  <path d="M 400 153 L 220 200" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowCyan)" />
  <!-- Arrow Right (State Space) -->
  <path d="M 600 153 L 780 200" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- Left: Divide & Conquer -->
  <g transform="translate(60, 205)" filter="url(#cardShadow)">
    <rect width="320" height="98" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="160" y="28" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CHIA ĐỂ TRỊ (DIVIDE &amp; CONQUER)</text>
    <text x="160" y="52" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Chia nhỏ bài toán thành các bài toán con độc lập</text>
    <text x="160" y="75" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5" font-style="italic" text-anchor="middle">Merge Sort, QuickSelect, Inversion Counting</text>
  </g>

  <!-- Right: State Space Search -->
  <g transform="translate(480, 205)" filter="url(#cardShadow)">
    <rect width="460" height="98" rx="10" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.5" />
    <text x="230" y="28" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TÌM KIẾM KHÔNG GIAN TRẠNG THÁI (STATE-SPACE)</text>
    <text x="230" y="50" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Xây dựng nghiệm từng bước qua các quyết định (Choices)</text>
    
    <!-- Sub-boxes for Backtracking & B&B -->
    <g transform="translate(20, 62)">
      <rect width="195" height="26" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2" />
      <text x="97" y="17" fill="#0369A1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Quay lui (Feasibility Pruning)</text>

      <rect x="225" width="195" height="26" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" />
      <text x="322" y="17" fill="#92400E" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Nhánh cận (Bound Pruning)</text>
    </g>
  </g>

  <!-- Downward Arrow to DP -->
  <path d="M 710 303 L 710 365" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <rect x="500" y="322" width="420" height="26" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
  <text x="710" y="339" fill="#065F46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Khi nhiều nhánh tìm kiếm lặp lại cùng State Identity ➔ Ghi nhớ</text>

  <!-- Bottom: Dynamic Programming -->
  <g transform="translate(460, 375)" filter="url(#cardShadow)">
    <rect width="500" height="85" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
    <text x="250" y="32" fill="#065F46" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">QUY HOẠCH ĐỘNG (DYNAMIC PROGRAMMING &amp; MEMOIZATION)</text>
    <text x="250" y="58" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ghi nhớ kết quả trên Đồ thị trạng thái DAG (Không tính lại bài toán con trùng lặp)</text>
  </g>

</svg>