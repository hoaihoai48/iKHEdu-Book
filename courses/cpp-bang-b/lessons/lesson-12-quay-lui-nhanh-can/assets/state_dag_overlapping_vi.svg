<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="390" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="390" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">TỪ CÂY TÌM KIẾM (SEARCH TREE) ĐẾN ĐỒ THỊ TRẠNG THÁI (STATE DAG)</text>
  <text x="500" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Nhận diện sự hội tụ trạng thái (State Identity) để chuyển hóa từ Quay lui vét cạn sang Quy hoạch động</text>

  <!-- Left: Tree Search with duplicate E -->
  <g transform="translate(60, 90)">
    <rect width="410" height="275" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="205" y="28" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. CÂY TÌM KIẾM (TREE SEARCH - VÉT CẠN)</text>
    
    <!-- Node A -->
    <circle cx="205" cy="65" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="205" y="70" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">A</text>
    
    <!-- Edges A -> B, C -->
    <path d="M 190 75 L 125 115" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 220 75 L 285 115" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Nodes B, C -->
    <circle cx="115" cy="125" r="18" fill="#0f2b46" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="115" y="130" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">B</text>
    <circle cx="295" cy="125" r="18" fill="#0f2b46" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="295" y="130" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">C</text>

    <!-- Edges B -> D, E | C -> E, F -->
    <path d="M 105 140 L 65 185" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 125 140 L 165 185" fill="none" stroke="#f59e0b" stroke-width="2" />
    <path d="M 285 140 L 245 185" fill="none" stroke="#f59e0b" stroke-width="2" />
    <path d="M 305 140 L 345 185" fill="none" stroke="#64748b" stroke-width="1.5" />

    <!-- Nodes D, E, E, F -->
    <circle cx="55" cy="200" r="16" fill="#1e293b" stroke="#64748b" /><text x="55" y="205" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">D</text>
    <circle cx="175" cy="200" r="18" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber)" /><text x="175" y="205" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">E</text>
    <circle cx="235" cy="200" r="18" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber)" /><text x="235" y="205" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">E</text>
    <circle cx="355" cy="200" r="16" fill="#1e293b" stroke="#64748b" /><text x="355" y="205" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">F</text>

    <text x="205" y="245" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Trạng thái E bị tính lại 2 lần!</text>
    <text x="205" y="263" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Độ phức tạp bùng nổ hàm mũ</text>
  </g>

  <!-- Right: DAG View with Memoization -->
  <g transform="translate(530, 90)">
    <rect width="410" height="275" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)" />
    <text x="205" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. ĐỒ THỊ TRẠNG THÁI DAG (MEMOIZATION / DP)</text>
    
    <!-- Node A -->
    <circle cx="205" cy="65" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="205" y="70" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">A</text>
    
    <!-- Edges A -> B, C -->
    <path d="M 190 75 L 125 115" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 220 75 L 285 115" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Nodes B, C -->
    <circle cx="115" cy="125" r="18" fill="#0f2b46" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="115" y="130" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">B</text>
    <circle cx="295" cy="125" r="18" fill="#0f2b46" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="295" y="130" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">C</text>

    <!-- Edges to Single E -->
    <path d="M 105 140 L 75 185" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 125 140 L 190 185" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCyan)" />
    <path d="M 285 140 L 220 185" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowCyan)" />
    <path d="M 305 140 L 335 185" fill="none" stroke="#64748b" stroke-width="1.5" />

    <!-- Nodes D, Single E, F -->
    <circle cx="65" cy="200" r="16" fill="#1e293b" stroke="#64748b" /><text x="65" y="205" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">D</text>
    <circle cx="205" cy="200" r="22" fill="url(#greenCard)" stroke="#10b981" stroke-width="2.5" filter="url(#glowGreen)" /><text x="205" y="205" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">E</text>
    <circle cx="345" cy="200" r="16" fill="#1e293b" stroke="#64748b" /><text x="345" y="205" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">F</text>

    <text x="205" y="245" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">E chỉ là 1 ĐỈNH DUY NHẤT trong DAG!</text>
    <text x="205" y="263" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Ghi nhớ kết quả (Memoization) ➔ O(Số đỉnh)</text>
  </g>

</svg>