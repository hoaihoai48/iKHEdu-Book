<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748B" flood-opacity="0.12" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="360" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />
  

  
  <text x="500" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">SO SÁNH BẢN CHẤT: 0/1 KNAPSACK VS UNBOUNDED KNAPSACK</text>
  <text x="500" y="65" fill="#475569" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Khác biệt sống còn nằm ở Chiều Duyệt Vòng Lặp Sức Chứa (Evaluation Order)</text>

  <!-- Left: 0/1 Knapsack -->
  <g transform="translate(80, 95)" filter="url(#cardShadow)">
    <rect width="400" height="235" rx="12" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <text x="200" y="32" fill="#0369A1" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">0/1 KNAPSACK (Mỗi đồ tối đa 1 lần)</text>
    
    <rect x="30" y="55" width="340" height="38" rx="6" fill="#EFF6FF" stroke="#3B82F6" />
    <text x="200" y="79" fill="#0F172A" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">for (int w = W; w &gt;= weight; --w)</text>

    <text x="35" y="125" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Duyệt NGƯỢC từ W giảm dần</text>
    <text x="35" y="155" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Đảm bảo trạng thái con là của món đồ (i-1)</text>
    <text x="35" y="185" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Tuyệt đối không tái sử dụng món đồ thứ i</text>
    <text x="200" y="218" fill="#0369A1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">dp[w] = max(dp[w], dp[w-weight] + val)</text>
  </g>

  <!-- Right: Unbounded Knapsack -->
  <g transform="translate(520, 95)" filter="url(#cardShadow)">
    <rect width="400" height="235" rx="12" fill="url(#blueCard)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="200" y="32" fill="#059669" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">UNBOUNDED KNAPSACK (Đồ vô hạn)</text>
    
    <rect x="30" y="55" width="340" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" />
    <text x="200" y="79" fill="#065F46" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">for (int w = weight; w &lt;= W; ++w)</text>

    <text x="35" y="125" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Duyệt XUÔI từ weight tăng dần</text>
    <text x="35" y="155" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Cho phép trạng thái kế tiếp tận dụng kết quả mới</text>
    <text x="35" y="185" fill="#334155" font-family="system-ui, sans-serif" font-size="12.5">• Cho phép chọn món đồ thứ i nhiều lần liên tiếp</text>
    <text x="200" y="218" fill="#059669" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">dp[w] = max(dp[w], dp[w-weight] + val)</text>
  </g>

</svg>