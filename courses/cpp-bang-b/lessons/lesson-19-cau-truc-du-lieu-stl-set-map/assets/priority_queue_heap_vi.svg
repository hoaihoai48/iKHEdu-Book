<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="400" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Hàng Đợi Ưu Tiên std::priority_queue (Binary Heap)</text>
  <text x="40" y="62" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cấu trúc dữ liệu cây nhị phân hoàn chỉnh tự duy trì phần tử cực trị ở đỉnh trong O(log N)</text>

  <!-- Two Cards: Max-Heap vs Min-Heap -->
  <g transform="translate(40, 85)">
    <!-- Max-Heap Card -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="405" height="285" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="25" y="32" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">1. Max-Heap (Mặc Định)</text>
      
      <!-- Declaration Badge -->
      <g transform="translate(25, 42)">
        <rect width="355" height="26" rx="5" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
        <text x="177" y="17" fill="#78350F" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">priority_queue&lt;int&gt; pq;</text>
      </g>

      <!-- Max-Heap Tree Visual (Centered around X=202) -->
      <g transform="translate(0, 78)">
        <!-- Connecting Edges -->
        <line x1="188" y1="36" x2="135" y2="70" stroke="#CBD5E1" stroke-width="2.5"/>
        <line x1="216" y1="36" x2="269" y2="70" stroke="#CBD5E1" stroke-width="2.5"/>

        <!-- Root Node (Max element) -->
        <circle cx="202" cy="24" r="22" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
        <text x="202" y="30" fill="#78350F" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">90</text>
        <rect x="232" y="12" width="70" height="20" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="267" y="26" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Gốc = MAX</text>

        <!-- Left Child -->
        <circle cx="125" cy="82" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
        <text x="125" y="87" fill="#334155" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">60</text>

        <!-- Right Child -->
        <circle cx="279" cy="82" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
        <text x="279" y="87" fill="#334155" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">70</text>
      </g>

      <!-- Bottom Operation Box -->
      <g transform="translate(25, 205)">
        <rect width="355" height="62" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
        <text x="15" y="24" fill="#047857" font-family="monospace" font-size="12.5" font-weight="700">• pq.top() ➔ 90 (Lấy MAX trong O(1))</text>
        <text x="15" y="46" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12">• pq.push(x), pq.pop() mất thời gian O(log N)</text>
      </g>
    </g>

    <!-- Min-Heap Card -->
    <g transform="translate(435, 0)" filter="url(#cardShadow)">
      <rect width="405" height="285" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="25" y="32" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">2. Min-Heap (Đảo Thứ Tự So Sánh)</text>
      
      <!-- Declaration Badge -->
      <g transform="translate(25, 42)">
        <rect width="355" height="26" rx="5" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="177" y="17" fill="#064E3B" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">priority_queue&lt;int, vector&lt;int&gt;, greater&lt;int&gt;&gt; pq;</text>
      </g>

      <!-- Min-Heap Tree Visual (Centered around X=202) -->
      <g transform="translate(0, 78)">
        <!-- Connecting Edges -->
        <line x1="188" y1="36" x2="135" y2="70" stroke="#CBD5E1" stroke-width="2.5"/>
        <line x1="216" y1="36" x2="269" y2="70" stroke="#CBD5E1" stroke-width="2.5"/>

        <!-- Root Node (Min element) -->
        <circle cx="202" cy="24" r="22" fill="#A7F3D0" stroke="#059669" stroke-width="2.5"/>
        <text x="202" y="30" fill="#064E3B" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">10</text>
        <rect x="232" y="12" width="70" height="20" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
        <text x="267" y="26" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Gốc = MIN</text>

        <!-- Left Child -->
        <circle cx="125" cy="82" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
        <text x="125" y="87" fill="#334155" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">35</text>

        <!-- Right Child -->
        <circle cx="279" cy="82" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
        <text x="279" y="87" fill="#334155" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">20</text>
      </g>

      <!-- Bottom Operation Box -->
      <g transform="translate(25, 205)">
        <rect width="355" height="62" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text x="15" y="24" fill="#047857" font-family="monospace" font-size="12.5" font-weight="700">• pq.top() ➔ 10 (Lấy MIN trong O(1))</text>
        <text x="15" y="46" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12">• pq.push(x), pq.pop() mất thời gian O(log N)</text>
      </g>
    </g>
  </g>
</svg>
