<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">SO SÁNH CHIẾN LƯỢC DUYỆT ĐỒ THỊ: BFS (QUEUE) VS DFS (ĐỆ QUY/STACK)</text>

  <rect x="50" y="70" width="380" height="280" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="240" y="105" fill="#38bdf8" font-size="17" font-weight="bold" text-anchor="middle">BFS: Duyệt Theo Chiều Rộng</text>
  <text x="75" y="145" fill="#f8fafc" font-size="14">• Cấu trúc: Dùng Hàng Đợi (Queue)</text>
  <text x="75" y="175" fill="#f8fafc" font-size="14">• Cơ chế: Lan tỏa theo từng lớp bán kính d=0, 1, 2...</text>
  <text x="75" y="205" fill="#4ade80" font-size="14">• Điểm mạnh: Tìm đường đi ngắn nhất đồ thị không trọng số</text>
  <text x="75" y="235" fill="#94a3b8" font-size="14">• Độ phức tạp: O(V + E)</text>

  <rect x="470" y="70" width="380" height="280" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="660" y="105" fill="#c084fc" font-size="17" font-weight="bold" text-anchor="middle">DFS: Duyệt Theo Chiều Sâu</text>
  <text x="495" y="145" fill="#f8fafc" font-size="14">• Cấu trúc: Dùng Đệ Quy hoặc Ngăn Xếp (Stack)</text>
  <text x="495" y="175" fill="#f8fafc" font-size="14">• Cơ chế: Đi sâu hết mức trên một nhánh rồi quay lui</text>
  <text x="495" y="205" fill="#c084fc" font-size="14">• Điểm mạnh: Phát hiện chu trình, kiểm tra liên thông, cây DFS</text>
  <text x="495" y="235" fill="#94a3b8" font-size="14">• Độ phức tạp: O(V + E)</text>
</svg>
