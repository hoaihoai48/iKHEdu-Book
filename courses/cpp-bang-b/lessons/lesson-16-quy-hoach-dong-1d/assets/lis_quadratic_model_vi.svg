<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
    <marker id="arrowTrace" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="400" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Mô hình Quy hoạch Động LIS O(N²) &amp; Cơ chế Truy vết</text>
  <text x="40" y="62" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Bất biến trạng thái: dp[i] là độ dài dãy con tăng dài nhất kết thúc bắt buộc tại phần tử A[i]</text>

  <!-- Array Container Card -->
  <g transform="translate(40, 85)" filter="url(#cardShadow)">
    <rect width="880" height="195" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Labels Column -->
    <g transform="translate(20, 20)">
      <text x="0" y="38" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Mảng A</text>
      <text x="0" y="55" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Giá trị gốc</text>

      <text x="0" y="112" fill="#0284C7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Mảng dp</text>
      <text x="0" y="129" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Độ dài LIS</text>
    </g>

    <!-- 8 Array Elements: Cell width 86, gap 10, start X=100 -->
    <!-- Element 0: A[0]=10, dp[0]=1 (Part of LIS) -->
    <g transform="translate(100, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 0</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">10</text>
      <rect y="80" width="86" height="42" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="43" y="106" fill="#065F46" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">1</text>
    </g>

    <!-- Element 1: A[1]=22, dp[1]=2 (Part of LIS) -->
    <g transform="translate(196, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 1</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">22</text>
      <rect y="80" width="86" height="42" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="43" y="106" fill="#065F46" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">2</text>
    </g>

    <!-- Element 2: A[2]=9, dp[2]=1 -->
    <g transform="translate(292, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 2</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">9</text>
      <rect y="80" width="86" height="42" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="43" y="106" fill="#0369A1" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">1</text>
    </g>

    <!-- Element 3: A[3]=33, dp[3]=3 (Part of LIS) -->
    <g transform="translate(388, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 3</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">33</text>
      <rect y="80" width="86" height="42" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="43" y="106" fill="#065F46" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">3</text>
    </g>

    <!-- Element 4: A[4]=21, dp[4]=2 -->
    <g transform="translate(484, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 4</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">21</text>
      <rect y="80" width="86" height="42" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="43" y="106" fill="#0369A1" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">2</text>
    </g>

    <!-- Element 5: A[5]=50, dp[5]=4 (Part of LIS) -->
    <g transform="translate(580, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 5</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">50</text>
      <rect y="80" width="86" height="42" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="43" y="106" fill="#065F46" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">4</text>
    </g>

    <!-- Element 6: A[6]=41, dp[6]=4 -->
    <g transform="translate(676, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 6</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">41</text>
      <rect y="80" width="86" height="42" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="43" y="106" fill="#0369A1" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">4</text>
    </g>

    <!-- Element 7: A[7]=60, dp[7]=5 (Max LIS) -->
    <g transform="translate(772, 15)">
      <text x="43" y="12" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i = 7</text>
      <rect y="18" width="86" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="43" y="44" fill="#0F172A" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">60</text>
      <rect y="80" width="86" height="42" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
      <text x="43" y="106" fill="#065F46" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">5 (MAX)</text>
    </g>

    <!-- Traceback Curved Paths underneath dp cells -->
    <!-- Cell centers X: 143 (i=0), 239 (i=1), 431 (i=3), 623 (i=5), 815 (i=7). Bottom Y = 137 -->
    <path d="M 815 142 C 815 178, 623 178, 623 147" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="4 2" marker-end="url(#arrowTrace)" />
    <path d="M 623 142 C 623 178, 431 178, 431 147" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="4 2" marker-end="url(#arrowTrace)" />
    <path d="M 431 142 C 431 178, 239 178, 239 147" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="4 2" marker-end="url(#arrowTrace)" />
    <path d="M 239 142 C 239 178, 143 178, 143 147" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="4 2" marker-end="url(#arrowTrace)" />

    <!-- Traceback explanation badge inside card -->
    <rect x="25" y="152" width="105" height="24" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <text x="77" y="168" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Cung truy vết ↩</text>
  </g>

  <!-- Bottom Details & Formula Grid (2 Cards) -->
  <g transform="translate(40, 295)">
    <!-- Result Card -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="430" height="85" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="20" y="28" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Dãy con tăng dài nhất (LIS) khôi phục:</text>
      <g transform="translate(20, 38)">
        <rect width="390" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text x="195" y="22" fill="#047857" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">[ 10 ➔ 22 ➔ 33 ➔ 50 ➔ 60 ]  (LIS = 5)</text>
      </g>
    </g>

    <!-- Formula Card -->
    <g transform="translate(450, 0)" filter="url(#cardShadow)">
      <rect width="430" height="85" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
      <text x="20" y="28" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Công thức quy hoạch động &amp; Độ phức tạp:</text>
      <text x="20" y="52" fill="#0C4A6E" font-family="monospace" font-size="12" font-weight="600">dp[i] = 1 + max({dp[j] | 0 ≤ j &lt; i và A[j] &lt; A[i]})</text>
      <text x="20" y="72" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12">Thời gian: <tspan font-weight="700" fill="#0F172A">O(N²)</tspan> • Bộ nhớ: <tspan font-weight="700" fill="#0F172A">O(N)</tspan> với mảng dp và trace</text>
    </g>
  </g>
</svg>