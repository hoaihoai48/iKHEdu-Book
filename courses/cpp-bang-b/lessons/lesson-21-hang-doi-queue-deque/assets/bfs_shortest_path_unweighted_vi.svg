<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="900" height="380" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16"/>
  <text x="450" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">TÌM ĐƯỜNG ĐI NGẮN NHẤT TRÊN ĐỒ THỊ KHÔNG TRỌNG SỐ BẰNG BFS</text>

  <!-- BFS shortest path grid -->
  <g transform="translate(100, 80)">
    <circle cx="100" cy="120" r="24" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
    <text x="100" y="126" fill="#1E293B" font-weight="bold" text-anchor="middle">S (0)</text>

    <line x1="124" y1="120" x2="236" y2="60" stroke="#4ade80" stroke-width="3"/>
    <line x1="124" y1="120" x2="236" y2="180" stroke="#4ade80" stroke-width="3"/>

    <circle cx="260" cy="60" r="22" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="260" y="66" fill="#1E293B" text-anchor="middle">u (1)</text>
    <circle cx="260" cy="180" r="22" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="260" y="186" fill="#1E293B" text-anchor="middle">v (1)</text>

    <line x1="282" y1="60" x2="418" y2="120" stroke="#4ade80" stroke-width="3"/>
    <line x1="282" y1="180" x2="418" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>

    <circle cx="440" cy="120" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    <text x="440" y="126" fill="#1E293B" font-weight="bold" text-anchor="middle">T (2)</text>
  </g>

  <rect x="580" y="80" width="240" height="240" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="700" y="115" fill="#92400E" font-size="16" font-weight="bold" text-anchor="middle">Định Lý BFS Cơ Bản</text>
  <text x="600" y="150" fill="#1E293B" font-size="13">• Mỗi đỉnh thăm lần đầu tiên</text>
  <text x="600" y="175" fill="#1E293B" font-size="13">  đảm bảo có khoảng cách min d[v]</text>
  <text x="600" y="210" fill="#065F46" font-family="monospace" font-size="13">• dist[v] = dist[u] + 1</text>
  <text x="600" y="240" fill="#0369A1" font-family="monospace" font-size="13">• parent[v] = u (truy vết)</text>
  <text x="600" y="275" fill="#475569" font-size="13">• Độ phức tạp: O(V + E)</text>
</svg>
