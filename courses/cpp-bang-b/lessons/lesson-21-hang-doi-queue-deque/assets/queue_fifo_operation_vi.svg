<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="380" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16"/>
  <text x="450" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CƠ CHẾ FIFO CỦA HÀNG ĐỢI (QUEUE) &amp; LAN TỎA BFS THEO TỪNG TẦNG</text>
  <text x="450" y="68" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">First-In First-Out: Phần tử vào trước sẽ được lấy ra xử lý trước</text>

  <!-- Queue container card -->
  <g transform="translate(60, 90)" filter="url(#cardShadow)">
    <rect width="780" height="110" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Left Label: POP -->
    <rect x="25" y="38" width="165" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="107" y="60" fill="#15803D" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⬅ POP (q.front())</text>

    <!-- Pipe Body -->
    <rect x="210" y="24" width="360" height="62" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Elements in pipe -->
    <!-- u1 -->
    <rect x="225" y="32" width="65" height="46" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="257" y="60" fill="#065F46" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">u1</text>

    <!-- u2 -->
    <rect x="305" y="32" width="65" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="337" y="60" fill="#334155" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">u2</text>

    <!-- u3 -->
    <rect x="385" y="32" width="65" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="417" y="60" fill="#334155" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">u3</text>

    <!-- u4 -->
    <rect x="465" y="32" width="65" height="46" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="497" y="60" fill="#B45309" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">u4</text>

    <!-- Right Label: PUSH -->
    <rect x="590" y="38" width="165" height="34" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="672" y="60" fill="#B45309" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PUSH (q.push()) ⬅</text>
  </g>

  <!-- BFS Layered Exploration card -->
  <g transform="translate(60, 215)" filter="url(#cardShadow)">
    <rect width="780" height="145" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Layer 0: Root S (cy=60) -->
    <g transform="translate(80, 0)">
      <circle cx="50" cy="60" r="24" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="50" y="66" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Gốc S</text>
      <rect x="10" y="105" width="80" height="24" rx="4" fill="#DCFCE7"/>
      <text x="50" y="121" fill="#15803D" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tầng 0 (d=0)</text>
    </g>

    <!-- Connecting Edges S -> Layer 1 -->
    <line x1="154" y1="52" x2="295" y2="32" stroke="#94A3B8" stroke-width="2"/>
    <line x1="154" y1="68" x2="295" y2="88" stroke="#94A3B8" stroke-width="2"/>

    <!-- Layer 1: Nodes A & B -->
    <g transform="translate(320, 0)">
      <!-- Node A -->
      <circle cx="0" cy="30" r="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="0" y="35" fill="#1D4ED8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">A</text>
      <!-- Node B -->
      <circle cx="0" cy="90" r="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="0" y="95" fill="#1D4ED8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">B</text>
      <rect x="-45" y="118" width="90" height="20" rx="4" fill="#DBEAFE"/>
      <text x="0" y="132" fill="#1E40AF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tầng 1 (d=1)</text>
    </g>

    <!-- Connecting Edges Layer 1 -> Layer 2 -->
    <line x1="340" y1="30" x2="480" y2="30" stroke="#94A3B8" stroke-width="2"/>
    <line x1="340" y1="90" x2="480" y2="90" stroke="#94A3B8" stroke-width="2"/>

    <!-- Layer 2: Nodes C & D -->
    <g transform="translate(500, 0)">
      <!-- Node C -->
      <circle cx="0" cy="30" r="18" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
      <text x="0" y="35" fill="#7E22CE" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">C</text>
      <!-- Node D -->
      <circle cx="0" cy="90" r="18" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
      <text x="0" y="95" fill="#7E22CE" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">D</text>
      <rect x="-45" y="118" width="90" height="20" rx="4" fill="#F3E8FF"/>
      <text x="0" y="132" fill="#7E22CE" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tầng 2 (d=2)</text>
    </g>

    <!-- BFS Explanation Right side -->
    <g transform="translate(585, 20)">
      <text x="0" y="24" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">★ Quy tắc BFS loang tầng:</text>
      <text x="0" y="50" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Lần lượt thăm hết đỉnh d=1</text>
      <text x="0" y="72" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">  trước khi mở rộng sang d=2</text>
      <text x="0" y="98" fill="#059669" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">➜ Luôn tìm ra đường đi ngắn nhất</text>
    </g>
  </g>
</svg>
