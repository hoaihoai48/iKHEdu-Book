<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#0284C7" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" />
    </marker>
  </defs>

  <rect width="1000" height="390" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">CẤU TRÚC ĐIỀU HƯỚNG CỦA HÀM ĐỆ QUY f(N)</text>
  <text x="500" y="68" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Phân định 2 trường hợp sống còn: Điểm dừng cơ sở (Base Case) vs Bước thu nhỏ (Recursive Step)</text>

  <!-- Top Root -->
  <g transform="translate(370, 95)" filter="url(#cardShadow)">
    <rect width="260" height="55" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="130" y="27" fill="#1E3A8A" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">HÀM ĐỆ QUY f(N)</text>
    <text x="130" y="45" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Nhận tham số quy mô N</text>
  </g>

  <!-- Left Arrow (Base Case) -->
  <path d="M 430 150 L 280 200" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <rect x="280" y="158" width="145" height="26" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="352" y="176" fill="#065F46" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">N là Base Case?</text>

  <!-- Right Arrow (Recursive Step) -->
  <path d="M 570 150 L 720 200" fill="none" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  <rect x="575" y="158" width="155" height="26" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="652" y="176" fill="#0369A1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">N là Recursive Case?</text>

  <!-- Left Card: Base Case Action -->
  <g transform="translate(100, 205)" filter="url(#cardShadow)">
    <rect width="360" height="155" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
    <text x="180" y="32" fill="#065F46" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TRẢ VỀ ĐÁP ÁN NGAY LẬP TỨC</text>
    <text x="180" y="56" fill="#047857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">Ngắt đệ quy, không gọi thêm frame mới</text>
    <rect x="30" y="78" width="300" height="48" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="180" y="108" fill="#065F46" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">if (n &lt;= 1) return 1;</text>
  </g>

  <!-- Right Card: Recursive Step Action -->
  <g transform="translate(540, 205)" filter="url(#cardShadow)">
    <rect width="360" height="155" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
    <text x="180" y="32" fill="#0369A1" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">THU NHỎ QUY MÔ BÀI TOÁN</text>
    <text x="180" y="56" fill="#0284C7" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">Gọi f(N-1) hoặc f(N/2) và kết hợp kết quả</text>
    <rect x="30" y="78" width="300" height="48" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <text x="180" y="108" fill="#0369A1" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">return n * fact(n - 1);</text>
  </g>
</svg>