<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="1000" height="390" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">HỆ THỐNG PHÂN LOẠI THUẬT TOÁN ĐỆ QUY (RECURSION TAXONOMY)</text>
  <text x="500" y="68" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Phân biệt theo số nhánh gọi con trên mỗi Stack Frame và hình thái cây thực thi</text>

  <!-- Left: Linear Recursion -->
  <g transform="translate(80, 100)" filter="url(#cardShadow)">
    <rect width="400" height="260" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
    <text x="200" y="34" fill="#0369A1" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. ĐỆ QUY TUYẾN TÍNH (LINEAR)</text>
    <text x="200" y="58" fill="#0284C7" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Mỗi frame chỉ gọi đúng 1 đệ quy con</text>

    <rect x="25" y="76" width="350" height="42" rx="6" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" />
    <text x="200" y="102" fill="#0369A1" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cây thực thi: 1 nhánh thẳng (Depth = N)</text>

    <text x="40" y="150" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Giai thừa: <tspan font-family="monospace" font-weight="bold" fill="#0369A1">fact(n) = n * fact(n - 1)</tspan></text>
    <text x="40" y="180" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Tìm ước chung: <tspan font-family="monospace" font-weight="bold" fill="#0369A1">gcd(a, b) = gcd(b, a % b)</tspan></text>
    <text x="40" y="210" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Lũy thừa nhị phân: <tspan font-family="monospace" font-weight="bold" fill="#0369A1">powerRec(a, b / 2)</tspan></text>
    <text x="200" y="245" fill="#0369A1" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Độ phức tạp thời gian: O(N) hoặc O(log N)</text>
  </g>

  <!-- Right: Branching Recursion -->
  <g transform="translate(520, 100)" filter="url(#cardShadow)">
    <rect width="400" height="260" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
    <text x="200" y="34" fill="#065F46" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. ĐỆ QUY PHÂN NHÁNH (BRANCHING)</text>
    <text x="200" y="58" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Mỗi frame gọi ≥ 2 lời gọi đệ quy con</text>

    <rect x="25" y="76" width="350" height="42" rx="6" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5" />
    <text x="200" y="102" fill="#065F46" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cây thực thi: Cây nhị phân / Đa phân bùng nổ</text>

    <text x="40" y="150" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Đệ quy nhị phân: <tspan font-family="monospace" font-weight="bold" fill="#065F46">fib(n-1) + fib(n-2) (O(2ᴺ))</tspan></text>
    <text x="40" y="180" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Tháp Hà Nội: Chuyển N đĩa qua cọc trung gian</text>
    <text x="40" y="210" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Đa phân: Sinh hoán vị, Duyệt mọi tập con</text>
    <text x="200" y="245" fill="#065F46" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Độ phức tạp thời gian: O(2ᴺ) hoặc O(Kᴺ)</text>
  </g>
</svg>