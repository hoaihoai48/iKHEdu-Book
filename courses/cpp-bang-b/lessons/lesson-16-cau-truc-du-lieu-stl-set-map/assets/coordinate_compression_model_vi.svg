<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="900" height="380" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16"/>
  <text x="450" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">KỸ THUẬT NÉN TỌA ĐỘ (COORDINATE COMPRESSION): [10^9] → [0..N-1]</text>

  <!-- Original Array -->
  <text x="80" y="95" fill="#92400E" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Mảng Gốc A (Giá trị cực lớn ≤ 10^9):</text>
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="130" height="45" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="65" y="28" fill="#1E293B" font-size="16" font-family="monospace" text-anchor="middle">1000000000</text>
    <rect x="145" y="0" width="130" height="45" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="210" y="28" fill="#1E293B" font-size="16" font-family="monospace" text-anchor="middle">50000</text>
    <rect x="290" y="0" width="130" height="45" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="355" y="28" fill="#1E293B" font-size="16" font-family="monospace" text-anchor="middle">1000000000</text>
    <rect x="435" y="0" width="130" height="45" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="500" y="28" fill="#1E293B" font-size="16" font-family="monospace" text-anchor="middle">7</text>
    <rect x="580" y="0" width="130" height="45" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
    <text x="645" y="28" fill="#1E293B" font-size="16" font-family="monospace" text-anchor="middle">50000</text>
  </g>

  <!-- Process -->
  <text x="450" y="195" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Quy trình: Copy → sort() → unique() → erase() → lower_bound() ánh xạ</text>
  <line x1="450" y1="165" x2="450" y2="180" stroke="#38bdf8" stroke-width="2"/>
  <line x1="450" y1="205" x2="450" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compressed Array -->
  <text x="80" y="255" fill="#065F46" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Mảng Nén Sau Ánh Xạ (Chỉ số 0..K-1):</text>
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="130" height="45" fill="#D1FAE5" stroke="#059669" rx="6"/>
    <text x="65" y="28" fill="#1E293B" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">2</text>
    <rect x="145" y="0" width="130" height="45" fill="#D1FAE5" stroke="#059669" rx="6"/>
    <text x="210" y="28" fill="#1E293B" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">1</text>
    <rect x="290" y="0" width="130" height="45" fill="#D1FAE5" stroke="#059669" rx="6"/>
    <text x="355" y="28" fill="#1E293B" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">2</text>
    <rect x="435" y="0" width="130" height="45" fill="#D1FAE5" stroke="#059669" rx="6"/>
    <text x="500" y="28" fill="#1E293B" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">0</text>
    <rect x="580" y="0" width="130" height="45" fill="#D1FAE5" stroke="#059669" rx="6"/>
    <text x="645" y="28" fill="#1E293B" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">1</text>
  </g>
  <text x="450" y="350" fill="#475569" font-family="monospace" font-size="13" text-anchor="middle">Bảng tra cứu: vals = [7, 50000, 1000000000] (Kích thước mảng nén K = 3)</text>
</svg>
