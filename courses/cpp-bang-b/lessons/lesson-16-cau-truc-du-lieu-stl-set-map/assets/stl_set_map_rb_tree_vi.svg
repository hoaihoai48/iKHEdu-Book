<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <rect width="900" height="420" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">SO SÁNH CẤU TRÚC DỮ LIỆU STL: SET / MAP (R-B TREE) VS UNORDERED_MAP (HASH)</text>

  <!-- Box 1: std::set / std::map -->
  <rect x="50" y="70" width="380" height="320" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="240" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">std::set / std::map (Red-Black Tree)</text>
  <text x="240" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Cây nhị phân tìm kiếm tự cân bằng (Tự động sắp thứ tự)</text>

  <!-- Tree drawing -->
  <circle cx="240" cy="175" r="20" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="240" y="181" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">50</text>

  <circle cx="160" cy="235" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="240" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">20</text>

  <circle cx="320" cy="235" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="240" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">80</text>

  <line x1="225" y1="188" x2="175" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="255" y1="188" x2="305" y2="222" stroke="#94a3b8" stroke-width="2"/>

  <rect x="70" y="280" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="85" y="305" fill="#4ade80" font-family="monospace" font-size="13">• Thời gian: O(log N) cho find, insert, erase</text>
  <text x="85" y="330" fill="#f8fafc" font-family="monospace" font-size="13">• Thứ tự: Luôn tăng dần theo Key</text>
  <text x="85" y="355" fill="#facc15" font-family="monospace" font-size="13">• Hỗ trợ: lower_bound, upper_bound O(log N)</text>

  <!-- Box 2: std::unordered_set / unordered_map -->
  <rect x="470" y="70" width="380" height="320" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="660" y="105" fill="#c084fc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">std::unordered_map (Hash Table)</text>
  <text x="660" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Bảng băm trực tiếp (Không duy trì thứ tự)</text>

  <!-- Hash buckets -->
  <rect x="520" y="160" width="70" height="30" fill="#1e1b4b" stroke="#c084fc" rx="4"/>
  <text x="555" y="180" fill="#f8fafc" font-size="12" text-anchor="middle">Bucket 0</text>
  <line x1="590" y1="175" x2="630" y2="175" stroke="#facc15" stroke-width="2"/>
  <rect x="630" y="160" width="80" height="30" fill="#312e81" rx="4"/>
  <text x="670" y="180" fill="#f8fafc" font-size="12" text-anchor="middle">Key=14</text>

  <rect x="520" y="205" width="70" height="30" fill="#1e1b4b" stroke="#c084fc" rx="4"/>
  <text x="555" y="225" fill="#f8fafc" font-size="12" text-anchor="middle">Bucket 1</text>
  <line x1="590" y1="220" x2="630" y2="220" stroke="#facc15" stroke-width="2"/>
  <rect x="630" y="205" width="80" height="30" fill="#312e81" rx="4"/>
  <text x="670" y="225" fill="#f8fafc" font-size="12" text-anchor="middle">Key=71</text>

  <rect x="490" y="280" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="505" y="305" fill="#4ade80" font-family="monospace" font-size="13">• Thời gian TB: O(1) cho find, insert, erase</text>
  <text x="505" y="330" fill="#f87171" font-family="monospace" font-size="13">• Worst Case: O(N) khi bị tấn công xung đột</text>
  <text x="505" y="355" fill="#94a3b8" font-family="monospace" font-size="13">• Không hỗ trợ lower_bound / upper_bound</text>
</svg>
