<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
    <marker id="arrowHash" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="#A855F7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="440" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">So Sánh Cấu Trúc Dữ Liệu STL: Set/Map vs Unordered_Map</text>
  <text x="40" y="62" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Bản chất cây nhị phân đỏ-đen (tự sắp thứ tự) so với bảng băm (truy xuất tức thì)</text>

  <!-- Two Main Comparison Cards -->
  <g transform="translate(40, 85)">
    <!-- Left Card: std::set / std::map -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="405" height="325" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
      <text x="25" y="30" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">1. std::set / std::map (Red-Black Tree)</text>
      
      <!-- Subtitle badge -->
      <g transform="translate(25, 42)">
        <rect width="355" height="26" rx="5" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
        <text x="177" y="17" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Cây nhị phân tìm kiếm tự cân bằng • Tự sắp tăng dần</text>
      </g>

      <!-- RB Tree Visual -->
      <g transform="translate(0, 78)">
        <line x1="188" y1="36" x2="135" y2="70" stroke="#94A3B8" stroke-width="2"/>
        <line x1="216" y1="36" x2="269" y2="70" stroke="#94A3B8" stroke-width="2"/>

        <!-- Root Node 50 -->
        <circle cx="202" cy="24" r="20" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
        <text x="202" y="30" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">50</text>

        <!-- Left Node 20 -->
        <circle cx="125" cy="80" r="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
        <text x="125" y="85" fill="#0369A1" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">20</text>

        <!-- Right Node 80 -->
        <circle cx="279" cy="80" r="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
        <text x="279" y="85" fill="#0369A1" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">80</text>
      </g>

      <!-- Characteristics Box -->
      <g transform="translate(25, 200)">
        <rect width="355" height="105" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="15" y="25" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✓ Thao tác:</text>
        <text x="90" y="25" fill="#334155" font-family="monospace" font-size="12">find, insert, erase trong O(log N)</text>

        <text x="15" y="50" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✓ Thứ tự:</text>
        <text x="90" y="50" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12">Luôn tăng dần theo Key</text>

        <text x="15" y="75" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✓ Tìm kiếm:</text>
        <text x="90" y="75" fill="#0C4A6E" font-family="monospace" font-size="12">lower_bound, upper_bound O(log N)</text>

        <text x="15" y="95" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Phù hợp khi cần phần tử kế cận, đếm phân vị, thứ tự.</text>
      </g>
    </g>

    <!-- Right Card: std::unordered_map -->
    <g transform="translate(435, 0)" filter="url(#cardShadow)">
      <rect width="405" height="325" rx="12" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
      <text x="25" y="30" fill="#7E22CE" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">2. std::unordered_map (Hash Table)</text>
      
      <!-- Subtitle badge -->
      <g transform="translate(25, 42)">
        <rect width="355" height="26" rx="5" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1"/>
        <text x="177" y="17" fill="#7E22CE" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Bảng băm trực tiếp • Không duy trì bất kỳ thứ tự nào</text>
      </g>

      <!-- Hash Table Visual (Buckets and Keys) -->
      <g transform="translate(25, 82)">
        <!-- Bucket 0 -->
        <g transform="translate(20, 10)">
          <rect width="80" height="32" rx="6" fill="#EDE9FE" stroke="#A855F7" stroke-width="1.5"/>
          <text x="40" y="21" fill="#6B21A8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Bucket 0</text>
          
          <line x1="80" y1="16" x2="135" y2="16" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowHash)"/>

          <rect x="140" width="160" height="32" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
          <text x="220" y="21" fill="#1E40AF" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Key: 14 ➔ Val: "A"</text>
        </g>

        <!-- Bucket 1 -->
        <g transform="translate(20, 52)">
          <rect width="80" height="32" rx="6" fill="#EDE9FE" stroke="#A855F7" stroke-width="1.5"/>
          <text x="40" y="21" fill="#6B21A8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Bucket 1</text>
          
          <line x1="80" y1="16" x2="135" y2="16" stroke="#A855F7" stroke-width="2" marker-end="url(#arrowHash)"/>

          <rect x="140" width="160" height="32" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
          <text x="220" y="21" fill="#1E40AF" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Key: 71 ➔ Val: "B"</text>
        </g>
      </g>

      <!-- Characteristics Box -->
      <g transform="translate(25, 200)">
        <rect width="355" height="105" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
        <text x="15" y="25" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✓ Thao tác:</text>
        <text x="90" y="25" fill="#047857" font-family="monospace" font-size="12" font-weight="700">Trung bình O(1) cho find, insert</text>

        <text x="15" y="50" fill="#B91C1C" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✗ Rủi ro:</text>
        <text x="90" y="50" fill="#B91C1C" font-family="system-ui, -apple-system, sans-serif" font-size="12">Worst Case O(N) khi xung đột băm (Anti-hash)</text>

        <text x="15" y="75" fill="#B91C1C" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✗ Giới hạn:</text>
        <text x="90" y="75" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12">Không hỗ trợ lower_bound / upper_bound</text>

        <text x="15" y="95" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Dùng khi chỉ cần đếm tần suất đơn thuần và không lo hack test.</text>
      </g>
    </g>
  </g>
</svg>
