<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">HÀNG ĐỢI ƯU TIÊN: STD::PRIORITY_QUEUE (MAX-HEAP VÀ MIN-HEAP)</text>

  <!-- Max Heap -->
  <rect x="50" y="70" width="380" height="280" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="240" y="105" fill="#facc15" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Max-Heap (Mặc Định)</text>
  <text x="240" y="130" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">priority_queue&lt;int&gt; pq;</text>

  <circle cx="240" cy="175" r="20" fill="#854d0e" stroke="#facc15" stroke-width="2"/>
  <text x="240" y="181" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">90</text>
  <circle cx="160" cy="235" r="18" fill="#1e1b4b" stroke="#334155" stroke-width="2"/>
  <text x="160" y="240" fill="#f8fafc" font-size="13" text-anchor="middle">60</text>
  <circle cx="320" cy="235" r="18" fill="#1e1b4b" stroke="#334155" stroke-width="2"/>
  <text x="320" y="240" fill="#f8fafc" font-size="13" text-anchor="middle">70</text>
  <line x1="225" y1="188" x2="175" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="255" y1="188" x2="305" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="310" fill="#4ade80" font-family="monospace" font-size="14" text-anchor="middle">pq.top() trả về MAX trong O(1)</text>

  <!-- Min Heap -->
  <rect x="470" y="70" width="380" height="280" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="660" y="105" fill="#4ade80" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Min-Heap (Đảo Thứ Tự)</text>
  <text x="660" y="130" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">priority_queue&lt;int, vector&lt;int&gt;, greater&lt;int&gt;&gt; pq;</text>

  <circle cx="660" cy="175" r="20" fill="#065f46" stroke="#4ade80" stroke-width="2"/>
  <text x="660" y="181" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">10</text>
  <circle cx="580" cy="235" r="18" fill="#1e1b4b" stroke="#334155" stroke-width="2"/>
  <text x="580" y="240" fill="#f8fafc" font-size="13" text-anchor="middle">35</text>
  <circle cx="740" cy="235" r="18" fill="#1e1b4b" stroke="#334155" stroke-width="2"/>
  <text x="740" y="240" fill="#f8fafc" font-size="13" text-anchor="middle">20</text>
  <line x1="645" y1="188" x2="595" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="675" y1="188" x2="725" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <text x="660" y="310" fill="#4ade80" font-family="monospace" font-size="14" text-anchor="middle">pq.top() trả về MIN trong O(1)</text>
</svg>
