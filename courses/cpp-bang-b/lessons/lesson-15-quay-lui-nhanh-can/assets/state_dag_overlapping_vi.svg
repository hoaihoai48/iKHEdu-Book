<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.12" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0284C7" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" /></marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="390" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="42" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">TỪ CÂY TÌM KIẾM (SEARCH TREE) ĐẾN ĐỒ THỊ TRẠNG THÁI (STATE DAG)</text>
  <text x="500" y="68" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Nhận diện sự hội tụ trạng thái (State Identity) để chuyển hóa từ Quay lui vét cạn sang Quy hoạch động</text>

  <!-- Left: Tree Search with duplicate E -->
  <g transform="translate(60, 90)" filter="url(#cardShadow)">
    <rect width="410" height="275" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" />
    <text x="205" y="28" fill="#B91C1C" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. CÂY TÌM KIẾM (TREE SEARCH - VÉT CẠN)</text>
    
    <!-- Node A -->
    <circle cx="205" cy="65" r="18" fill="#EFF6FF" stroke="#0284C7" stroke-width="2" />
    <text x="205" y="70" fill="#0369A1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">A</text>
    
    <!-- Edges A -> B, C -->
    <path d="M 190 75 L 125 115" fill="none" stroke="#0284C7" stroke-width="1.5" />
    <path d="M 220 75 L 285 115" fill="none" stroke="#0284C7" stroke-width="1.5" />
    
    <!-- Nodes B, C -->
    <circle cx="115" cy="125" r="18" fill="#EFF6FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="115" y="130" fill="#0369A1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">B</text>
    <circle cx="295" cy="125" r="18" fill="#EFF6FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="295" y="130" fill="#0369A1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">C</text>

    <!-- Edges B -> D, E | C -> E, F -->
    <path d="M 105 140 L 65 185" fill="none" stroke="#64748B" stroke-width="1.5" />
    <path d="M 125 140 L 165 185" fill="none" stroke="#D97706" stroke-width="2" />
    <path d="M 285 140 L 245 185" fill="none" stroke="#D97706" stroke-width="2" />
    <path d="M 305 140 L 345 185" fill="none" stroke="#64748B" stroke-width="1.5" />

    <!-- Nodes D, E, E, F -->
    <circle cx="55" cy="200" r="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" /><text x="55" y="205" fill="#475569" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">D</text>
    <circle cx="175" cy="200" r="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2" /><text x="175" y="205" fill="#92400E" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">E</text>
    <circle cx="235" cy="200" r="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2" /><text x="235" y="205" fill="#92400E" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">E</text>
    <circle cx="355" cy="200" r="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" /><text x="355" y="205" fill="#475569" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F</text>

    <text x="205" y="245" fill="#B45309" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Trạng thái E bị tính lại 2 lần!</text>
    <text x="205" y="265" fill="#DC2626" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Độ phức tạp bùng nổ hàm mũ</text>
  </g>

  <!-- Right: DAG View with Memoization -->
  <g transform="translate(530, 90)" filter="url(#cardShadow)">
    <rect width="410" height="275" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="205" y="28" fill="#065F46" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. ĐỒ THỊ TRẠNG THÁI DAG (MEMOIZATION / DP)</text>
    
    <!-- Node A -->
    <circle cx="205" cy="65" r="18" fill="#EFF6FF" stroke="#0284C7" stroke-width="2" />
    <text x="205" y="70" fill="#0369A1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">A</text>
    
    <!-- Edges A -> B, C -->
    <path d="M 190 75 L 125 115" fill="none" stroke="#0284C7" stroke-width="1.5" />
    <path d="M 220 75 L 285 115" fill="none" stroke="#0284C7" stroke-width="1.5" />
    
    <!-- Nodes B, C -->
    <circle cx="115" cy="125" r="18" fill="#EFF6FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="115" y="130" fill="#0369A1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">B</text>
    <circle cx="295" cy="125" r="18" fill="#EFF6FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="295" y="130" fill="#0369A1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">C</text>

    <!-- Edges to Single E -->
    <path d="M 105 140 L 75 185" fill="none" stroke="#64748B" stroke-width="1.5" />
    <path d="M 125 140 L 190 185" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
    <path d="M 285 140 L 220 185" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
    <path d="M 305 140 L 335 185" fill="none" stroke="#64748B" stroke-width="1.5" />

    <!-- Nodes D, Single E, F -->
    <circle cx="65" cy="200" r="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" /><text x="65" y="205" fill="#475569" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">D</text>
    <circle cx="205" cy="200" r="22" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5" /><text x="205" y="205" fill="#065F46" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">E</text>
    <circle cx="345" cy="200" r="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" /><text x="345" y="205" fill="#475569" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">F</text>

    <text x="205" y="245" fill="#065F46" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">E chỉ là 1 ĐỈNH DUY NHẤT trong DAG!</text>
    <text x="205" y="265" fill="#047857" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Ghi nhớ kết quả (Memoization) ➔ O(Số đỉnh)</text>
  </g>

</svg>