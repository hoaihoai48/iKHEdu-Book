<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="380" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">KỸ THUẬT NÉN MẢNG 1D TRONG 0/1 KNAPSACK (DUYỆT NGƯỢC W GIẢM)</text>
  <text x="500" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Tránh dùng lại món đồ thứ i nhiều lần bằng cách duyệt sức chứa w từ W giảm dần về weight</text>

  <!-- Array W illustration -->
  <g transform="translate(100, 100)">
    <rect width="800" height="60" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="40" y="36" fill="#94a3b8" font-family="monospace" font-size="14">dp[w]</text>
    
    <!-- Cell w-weight -->
    <rect x="220" y="10" width="130" height="40" rx="6" fill="#0f2b46" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="285" y="35" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">dp[w - weight]</text>

    <!-- Cell w -->
    <rect x="580" y="10" width="120" height="40" rx="6" fill="url(#greenCard)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="640" y="35" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">dp[w]</text>
  </g>

  <!-- Backward arrow -->
  <path d="M 640 160 L 640 200 L 285 200 L 285 160" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)" />
  <text x="460" y="225" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Duyệt ngược: for (int w = W; w &gt;= weight; --w)</text>

  <!-- Explanation card -->
  <g transform="translate(100, 255)" filter="url(#cardShadow)">
    <rect width="800" height="95" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">TẠI SAO PHẢI DUYỆT NGƯỢC W?</text>
    <text x="30" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Khi cập nhật dp[w], ô dp[w - weight] vẫn đang giữ giá trị của đồ thứ (i-1), CHƯA bị đồ thứ i ghi đè.</text>
    <text x="30" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Tiết kiệm bộ nhớ từ O(N * W) xuống O(W) trong khi vẫn đảm bảo mỗi đồ chỉ chọn tối đa 1 lần!</text>
  </g>

</svg>