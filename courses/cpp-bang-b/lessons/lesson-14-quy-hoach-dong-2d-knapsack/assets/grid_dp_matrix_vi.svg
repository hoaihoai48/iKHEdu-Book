<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" /></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" /></marker>
  </defs>

  <rect width="1000" height="390" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="390" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">QUY HOẠCH ĐỘNG TRÊN LƯỚI 2D (GRID DP)</text>
  <text x="500" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Hệ thức chuyển trạng thái: Ô (i, j) chỉ nhận luồng đi từ Trên xuống (i-1, j) hoặc Trái sang (i, j-1)</text>

  <!-- Grid Cell (i-1, j) -->
  <g transform="translate(420, 100)" filter="url(#cardShadow)">
    <rect width="160" height="55" rx="8" fill="#0f2b46" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="80" y="26" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ô Trên</text>
    <text x="80" y="45" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">dp[i-1][j]</text>
  </g>

  <!-- Grid Cell (i, j-1) -->
  <g transform="translate(180, 185)" filter="url(#cardShadow)">
    <rect width="160" height="55" rx="8" fill="#0f2b46" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="80" y="26" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ô Trái</text>
    <text x="80" y="45" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">dp[i][j-1]</text>
  </g>

  <!-- Arrow down -->
  <path d="M 500 155 L 500 185" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  <!-- Arrow right -->
  <path d="M 340 212 L 410 212" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- Target Cell (i, j) -->
  <g transform="translate(420, 185)" filter="url(#cardShadow)">
    <rect width="160" height="55" rx="8" fill="url(#greenCard)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="80" y="26" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ô Đang Tính</text>
    <text x="80" y="45" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">dp[i][j]</text>
  </g>

  <!-- Card Formula -->
  <g transform="translate(100, 275)" filter="url(#cardShadow)">
    <rect width="800" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold">• Đếm số đường đi: dp[i][j] = (dp[i-1][j] + dp[i][j-1]) % MOD</text>
    <text x="30" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold">• Tìm tổng chi phí max: dp[i][j] = A[i][j] + max(dp[i-1][j], dp[i][j-1])</text>
    <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Vật cản tại (i, j): Gán cứng dp[i][j] = 0 (không có đường đi nào xuyên qua vật cản)</text>
  </g>

</svg>