<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">HÌNH CHỮ NHẬT LỚN NHẤT TRÊN BIỂU ĐỒ CỘT (LARGEST RECTANGLE IN HISTOGRAM)</text>

  <!-- Histogram bars -->
  <g transform="translate(150, 80)">
    <!-- Bar 1: h=2 -->
    <rect x="0" y="140" width="70" height="80" fill="#334155" stroke="#334155"/>
    <text x="35" y="185" fill="#94a3b8" font-size="14" text-anchor="middle">2</text>
    <!-- Bar 2: h=1 -->
    <rect x="75" y="180" width="70" height="40" fill="#334155" stroke="#334155"/>
    <text x="110" y="205" fill="#94a3b8" font-size="14" text-anchor="middle">1</text>
    <!-- Bar 3: h=5 (Selected) -->
    <rect x="150" y="20" width="70" height="200" fill="#047857" stroke="#4ade80" stroke-width="2"/>
    <text x="185" y="110" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">5</text>
    <!-- Bar 4: h=6 (Selected) -->
    <rect x="225" y="0" width="70" height="220" fill="#047857" stroke="#4ade80" stroke-width="2"/>
    <text x="260" y="110" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">6</text>
    <!-- Bar 5: h=2 -->
    <rect x="300" y="140" width="70" height="80" fill="#334155" stroke="#334155"/>
    <text x="335" y="185" fill="#94a3b8" font-size="14" text-anchor="middle">2</text>
    <!-- Bar 6: h=3 -->
    <rect x="375" y="100" width="70" height="120" fill="#334155" stroke="#334155"/>
    <text x="410" y="165" fill="#94a3b8" font-size="14" text-anchor="middle">3</text>
  </g>

  <rect x="620" y="90" width="230" height="210" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="735" y="125" fill="#4ade80" font-size="16" font-weight="bold" text-anchor="middle">Diện Tích Tối Ưu</text>
  <text x="640" y="160" fill="#f8fafc" font-size="14">Cột chiều cao h = 5</text>
  <text x="640" y="190" fill="#f8fafc" font-size="14">Biên trái: index 2</text>
  <text x="640" y="220" fill="#f8fafc" font-size="14">Biên phải: index 3</text>
  <text x="640" y="250" fill="#facc15" font-family="monospace" font-size="14">Chiều rộng w = 2</text>
  <text x="640" y="280" fill="#4ade80" font-family="monospace" font-size="16" font-weight="bold">Max Area = 5 × 2 = 10</text>
</svg>
