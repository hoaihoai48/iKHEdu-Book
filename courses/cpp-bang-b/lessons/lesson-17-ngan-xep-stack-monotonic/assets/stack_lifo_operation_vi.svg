<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CƠ CHẾ LIFO CỦA NGĂN XẾP (STACK) &amp; KIỂM TRA DÃY NGOẶC ĐÚNG</text>

  <!-- Stack container -->
  <g transform="translate(100, 80)">
    <rect x="50" y="20" width="160" height="220" fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-dasharray="0 160 220 160"/>
    <text x="130" y="270" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Stack (LIFO)</text>

    <!-- Stack elements -->
    <rect x="65" y="170" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#38bdf8"/>
    <text x="130" y="195" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">'(' (Đáy)</text>
    <rect x="65" y="120" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#38bdf8"/>
    <text x="130" y="145" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">'['</text>
    <rect x="65" y="70" width="130" height="40" rx="6" fill="#312e81" stroke="#facc15"/>
    <text x="130" y="95" fill="#facc15" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">'{' (Đỉnh st.top())</text>
  </g>

  <!-- Bracket matching explanation -->
  <rect x="420" y="80" width="420" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="630" y="115" fill="#4ade80" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Quy Tắc Khớp Dấu Ngoặc</text>
  <text x="445" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">1. Gặp ngoặc mở '(', '[', '{' → st.push(c)</text>
  <text x="445" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">2. Gặp ngoặc đóng ')', ']', '}' :</text>
  <text x="470" y="215" fill="#f87171" font-family="monospace" font-size="13">• Nếu st.empty() → SAI (Dư ngoặc đóng)</text>
  <text x="470" y="240" fill="#f87171" font-family="monospace" font-size="13">• Nếu st.top() không khớp loại → SAI</text>
  <text x="470" y="265" fill="#4ade80" font-family="monospace" font-size="13">• Nếu khớp → st.pop() ghép cặp thành công</text>
  <text x="445" y="295" fill="#facc15" font-family="system-ui, sans-serif" font-size="14">3. Kết thúc chuỗi: Hợp lệ khi st.empty() == true</text>
</svg>
