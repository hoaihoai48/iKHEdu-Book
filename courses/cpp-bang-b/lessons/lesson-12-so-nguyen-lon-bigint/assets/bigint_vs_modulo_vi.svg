<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="1000" height="400" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="45" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">SỐ HỌC DỮ LIỆU CỰC LỚN: CHỌN VŨ KHÍ NÀO?</text>
  <text x="500" y="75" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Phân định rõ ràng giữa bài toán yêu cầu số dư (Modulo) và bài toán giá trị chính xác (BigInt)</text>

  <!-- Left Card: Modulo -->
  <g transform="translate(80, 105)" filter="url(#cardShadow)">
    <rect width="400" height="265" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
    <text x="200" y="36" fill="#0369A1" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. MODULO ARITHMETIC (Chuyên đề 08)</text>
    <rect x="40" y="48" width="320" height="26" rx="6" fill="#E0F2FE" />
    <text x="200" y="66" fill="#0284C7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Khi đề bài yêu cầu: &quot;In ra kết quả mod 10⁹+7&quot;</text>
    <text x="40" y="112" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">• Giữ giá trị luôn trong giới hạn kiểu <tspan font-family="monospace" font-weight="bold" fill="#0369A1">long long</tspan></text>
    <text x="40" y="142" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">• Tốc độ cực đại <tspan font-family="monospace" font-weight="bold" fill="#0369A1">O(1)</tspan> và <tspan font-family="monospace" font-weight="bold" fill="#0369A1">O(log N)</tspan> bằng phần cứng CPU</text>
    <text x="40" y="172" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">• Dùng cho bài toán đếm tổ hợp C(N, K), quy hoạch động</text>
    <rect x="40" y="200" width="320" height="42" rx="8" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" />
    <text x="200" y="226" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">★ Ưu tiên số 1 khi có modulo!</text>
  </g>

  <!-- Right Card: BigInt -->
  <g transform="translate(520, 105)" filter="url(#cardShadow)">
    <rect width="400" height="265" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
    <text x="200" y="36" fill="#92400E" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. BIG INTEGER (Chuyên đề 09)</text>
    <rect x="40" y="48" width="320" height="26" rx="6" fill="#FEF3C7" />
    <text x="200" y="66" fill="#B45309" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Khi đề bài yêu cầu: &quot;Giá trị chính xác tuyệt đối&quot;</text>
    <text x="40" y="112" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">• Mô phỏng đặt tính trên <tspan font-family="monospace" font-weight="bold" fill="#92400E">string / vector&lt;int&gt;</tspan></text>
    <text x="40" y="142" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">• Tính chính xác 1000!, Fibonacci F(1000), 2¹⁰⁰⁰⁰</text>
    <text x="40" y="172" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13">• Độ phức tạp cộng <tspan font-family="monospace" font-weight="bold" fill="#92400E">O(L)</tspan>, nhân <tspan font-family="monospace" font-weight="bold" fill="#92400E">O(L²)</tspan> hoặc Base 10⁹</text>
    <rect x="40" y="200" width="320" height="42" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
    <text x="200" y="226" fill="#92400E" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">★ Bắt buộc khi không có modulo!</text>
  </g>
</svg>