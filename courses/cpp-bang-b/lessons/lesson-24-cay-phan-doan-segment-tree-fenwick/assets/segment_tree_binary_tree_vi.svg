<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748B" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="900" height="380" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16"/>
  <text x="450" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CÂY PHÂN ĐOẠN (SEGMENT TREE): QUẢN LÝ RANGE SUM &amp; RMQ TRONG O(LOG N)</text>

  <!-- Segment Tree Visual -->
  <g transform="translate(100, 70)">
    <!-- Root [1..4] -->
    <rect x="280" y="10" width="140" height="40" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="350" y="35" fill="#1E293B" font-weight="bold" text-anchor="middle">id=1 [1..4]: Sum=26</text>

    <!-- Level 1 -->
    <line x1="320" y1="50" x2="210" y2="90" stroke="#94a3b8" stroke-width="2"/>
    <line x1="380" y1="50" x2="490" y2="90" stroke="#94a3b8" stroke-width="2"/>

    <rect x="140" y="90" width="140" height="40" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="210" y="115" fill="#1E293B" text-anchor="middle">id=2 [1..2]: Sum=9</text>
    <rect x="420" y="90" width="140" height="40" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="490" y="115" fill="#1E293B" text-anchor="middle">id=3 [3..4]: Sum=17</text>

    <!-- Leaves -->
    <line x1="180" y1="130" x2="100" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <line x1="240" y1="130" x2="280" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <line x1="460" y1="130" x2="400" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <line x1="520" y1="130" x2="580" y2="170" stroke="#94a3b8" stroke-width="2"/>

    <rect x="40" y="170" width="100" height="35" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="90" y="193" fill="#92400E" text-anchor="middle">A[1]=4</text>
    <rect x="230" y="170" width="100" height="35" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="280" y="193" fill="#92400E" text-anchor="middle">A[2]=5</text>
    <rect x="350" y="170" width="100" height="35" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="400" y="193" fill="#92400E" text-anchor="middle">A[3]=8</text>
    <rect x="530" y="170" width="100" height="35" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="580" y="193" fill="#92400E" text-anchor="middle">A[4]=9</text>
  </g>

  <rect x="100" y="300" width="700" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="335" fill="#0369A1" font-size="14" text-anchor="middle">Mảng biểu diễn cây 4N phần tử: Nút con trái = 2*id, Nút con phải = 2*id + 1. Update/Query: O(log N).</text>
</svg>
