<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
    <marker id="arrowPush" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="#0284C7" />
    </marker>
    <marker id="arrowPop" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="400" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Cơ Chế LIFO Của Ngăn Xếp (Stack) &amp; Ứng Dụng Khớp Dấu Ngoặc</text>
  <text x="40" y="62" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Vào sau - Ra trước (Last In, First Out): Thao tác đẩy và rút chỉ diễn ra tại duy nhất một đầu đỉnh (Top)</text>

  <!-- Two Cards: Visual Stack Beaker vs Matching Rules -->
  <g transform="translate(40, 85)">
    <!-- Left Card: Stack Beaker Visual -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="360" height="285" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
      <text x="25" y="30" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Mô Phỏng Vật Lý Ngăn Xếp</text>

      <!-- U-Shaped Stack Container (Beaker): Left wall, Bottom wall, Right wall -->
      <!-- Beaker bounds: X=90 to 250 (width 160), Y=65 to 225 (height 160) -->
      <path d="M 90 65 L 90 225 L 250 225 L 250 65" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>

      <!-- Stack Elements Inside (width 140, height 36) -->
      <!-- Element 1: Bottom '(' -->
      <g transform="translate(100, 180)">
        <rect width="140" height="36" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
        <text x="70" y="23" fill="#0369A1" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">'('  [Đáy Stack]</text>
      </g>

      <!-- Element 2: Middle '[' -->
      <g transform="translate(100, 136)">
        <rect width="140" height="36" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
        <text x="70" y="23" fill="#0369A1" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">'['</text>
      </g>

      <!-- Element 3: Top '{' (st.top()) -->
      <g transform="translate(100, 92)">
        <rect width="140" height="36" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="70" y="23" fill="#92400E" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">'{'  (Đỉnh Top)</text>
      </g>

      <!-- Push & Pop Action Arrows at Top Opening -->
      <!-- PUSH arrow coming in from left -->
      <path d="M 45 48 L 115 75" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowPush)"/>
      <text x="35" y="44" fill="#0284C7" font-family="monospace" font-size="11.5" font-weight="700">st.push()</text>

      <!-- POP arrow exiting to right -->
      <path d="M 225 75 L 295 48" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowPop)"/>
      <text x="305" y="44" fill="#EF4444" font-family="monospace" font-size="11.5" font-weight="700">st.pop()</text>

      <!-- Footer Badge -->
      <g transform="translate(25, 240)">
        <rect width="310" height="30" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="155" y="20" fill="#0369A1" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">st.top() ➔ '{'  •  st.size() == 3</text>
      </g>
    </g>

    <!-- Right Card: Parenthesis Matching Logic -->
    <g transform="translate(385, 0)" filter="url(#cardShadow)">
      <rect width="495" height="285" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="25" y="30" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Thuật Toán Kiểm Tra Dãy Ngoặc Hợp Lệ</text>

      <!-- Rule 1: Open bracket -->
      <g transform="translate(25, 46)">
        <rect width="445" height="42" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
        <text x="15" y="26" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. Gặp ngoặc mở '(', '[', '{':</text>
        <text x="195" y="26" fill="#15803D" font-family="monospace" font-size="12.5">st.push(c);</text>
      </g>

      <!-- Rule 2: Closing bracket -->
      <g transform="translate(25, 96)">
        <rect width="445" height="110" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
        <text x="15" y="22" fill="#991B1B" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Gặp ngoặc đóng ')', ']', '}':</text>
        <text x="25" y="44" fill="#B91C1C" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Nếu <tspan font-family="monospace" font-weight="700">st.empty()</tspan> ➔ <tspan font-weight="700">SAI</tspan> (Thừa ngoặc đóng)</text>
        <text x="25" y="66" fill="#B91C1C" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Nếu <tspan font-family="monospace" font-weight="700">st.top()</tspan> không khớp loại ngoặc ➔ <tspan font-weight="700">SAI</tspan></text>
        <text x="25" y="90" fill="#15803D" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Nếu khớp đúng ➔ Gọi <tspan font-family="monospace" font-weight="700">st.pop()</tspan> để xóa cặp ngoặc hoàn tất</text>
      </g>

      <!-- Rule 3: End of string -->
      <g transform="translate(25, 214)">
        <rect width="445" height="52" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="15" y="22" fill="#1E40AF" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Duyệt xong toàn chuỗi:</text>
        <text x="15" y="42" fill="#1E3A8A" font-family="system-ui, -apple-system, sans-serif" font-size="12">Hợp lệ khi và chỉ khi <tspan font-family="monospace" font-weight="700">st.empty() == true</tspan> (Không còn ngoặc mở sót lại)</text>
      </g>
    </g>
  </g>
</svg>
