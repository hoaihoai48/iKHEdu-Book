<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="400" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Hình Chữ Nhật Lớn Nhất Trên Biểu Đồ Cột (Largest Rectangle in Histogram)</text>
  <text x="40" y="62" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Mỗi cột h[i] mở rộng sang trái (L[i]) và sang phải (R[i]) chừng nào các cột lân cận vẫn có chiều cao ≥ h[i]</text>

  <!-- Main Grid: Left Chart Card vs Right Calculation Card -->
  <g transform="translate(40, 85)">
    <!-- Left Card: Histogram Chart -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="530" height="285" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="25" y="30" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">BIỂU ĐỒ CỘT VÀ VÙNG DIỆN TÍCH TỐI ƯU</text>

      <!-- Baseline and Bars Container (Baseline Y = 220) -->
      <g transform="translate(30, 20)">
        <!-- Horizontal Baseline -->
        <line x1="0" y1="210" x2="470" y2="210" stroke="#94A3B8" stroke-width="2"/>

        <!-- Bar 0: h=2 (Height: 2 * 28 = 56, Y = 210 - 56 = 154) -->
        <g transform="translate(15, 154)">
          <rect width="65" height="56" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="32" y="34" fill="#475569" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">2</text>
          <text x="32" y="74" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i=0</text>
        </g>

        <!-- Bar 1: h=1 (Height: 1 * 28 = 28, Y = 210 - 28 = 182) -->
        <g transform="translate(90, 182)">
          <rect width="65" height="28" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="32" y="20" fill="#475569" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">1</text>
          <text x="32" y="46" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i=1</text>
        </g>

        <!-- Optimal Rectangle Background Behind Bars 2 & 3 -->
        <!-- Starts at X=165, Y=210 - (5 * 28) = 70. Width = 145, Height = 140 -->
        <rect x="162" y="68" width="146" height="142" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2"/>

        <!-- Bar 2: h=5 (Selected Optimal Bar, Height: 5 * 28 = 140, Y = 210 - 140 = 70) -->
        <g transform="translate(165, 70)">
          <rect width="65" height="140" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
          <text x="32" y="76" fill="#065F46" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">5</text>
          <text x="32" y="158" fill="#059669" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">i=2 (L)</text>
        </g>

        <!-- Bar 3: h=6 (Height: 6 * 28 = 168, Y = 210 - 168 = 42) -->
        <g transform="translate(240, 42)">
          <rect width="65" height="168" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
          <text x="32" y="88" fill="#065F46" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">6</text>
          <text x="32" y="186" fill="#059669" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">i=3 (R)</text>
        </g>

        <!-- Bar 4: h=2 (Height: 2 * 28 = 56, Y = 210 - 56 = 154) -->
        <g transform="translate(315, 154)">
          <rect width="65" height="56" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="32" y="34" fill="#475569" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">2</text>
          <text x="32" y="74" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i=4</text>
        </g>

        <!-- Bar 5: h=3 (Height: 3 * 28 = 84, Y = 210 - 84 = 126) -->
        <g transform="translate(390, 126)">
          <rect width="65" height="84" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="32" y="48" fill="#475569" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">3</text>
          <text x="32" y="102" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">i=5</text>
        </g>
      </g>
    </g>

    <!-- Right Card: Optimal Area Calculation & Monotonic Stack Strategy -->
    <g transform="translate(555, 0)" filter="url(#cardShadow)">
      <rect width="305" height="285" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="25" y="30" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Diện Tích Tối Ưu</text>

      <!-- Key Parameters Grid -->
      <g transform="translate(20, 48)">
        <rect width="265" height="110" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text x="15" y="24" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Cột xét: <tspan font-family="monospace" font-weight="700" fill="#059669">h[2] = 5</tspan></text>
        <text x="15" y="48" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Biên trái L[2]: <tspan font-family="monospace" font-weight="700" fill="#0284C7">index 2</tspan></text>
        <text x="15" y="72" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12.5">• Biên phải R[2]: <tspan font-family="monospace" font-weight="700" fill="#0284C7">index 3</tspan></text>
        <text x="15" y="96" fill="#92400E" font-family="monospace" font-size="13" font-weight="700">• Chiều rộng w = 3 - 2 + 1 = 2</text>
      </g>

      <!-- Area Formula Highlight -->
      <g transform="translate(20, 170)">
        <rect width="265" height="42" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
        <text x="132" y="26" fill="#064E3B" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">Max Area = 5 × 2 = 10</text>
      </g>

      <!-- Strategy Badge -->
      <g transform="translate(20, 222)">
        <rect width="265" height="46" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text x="12" y="18" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="700">★ Chiến lược Monotonic Stack:</text>
        <text x="12" y="34" fill="#64748B" font-family="system-ui, sans-serif" font-size="10.5">Tìm L[i] và R[i] cho toàn bộ N cột trong <tspan font-weight="700" fill="#0F172A">O(N)</tspan></text>
      </g>
    </g>
  </g>
</svg>
