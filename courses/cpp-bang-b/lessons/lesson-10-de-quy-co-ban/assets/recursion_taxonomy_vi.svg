<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
  </defs>

  <rect width="1000" height="390" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="390" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">HỆ THỐNG PHÂN LOẠI THUẬT TOÁN ĐỆ QUY (RECURSION TAXONOMY)</text>
  <text x="500" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Phân biệt theo số nhánh gọi con trên mỗi Stack Frame và hình thái cây thực thi</text>

  <!-- Left: Linear Recursion -->
  <g transform="translate(80, 100)" filter="url(#cardShadow)">
    <rect width="400" height="260" rx="12" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <text x="200" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. ĐỆ QUY TUYẾN TÍNH (LINEAR)</text>
    <text x="200" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mỗi frame chỉ gọi đúng 1 đệ quy con</text>

    <rect x="25" y="78" width="350" height="42" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="200" y="104" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cây thực thi: 1 nhánh thẳng (Depth = N)</text>

    <text x="40" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Giai thừa: fact(n) = n * fact(n - 1)</text>
    <text x="40" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Tìm ước chung: gcd(a, b) = gcd(b, a % b)</text>
    <text x="40" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Lũy thừa nhị phân: powerRec(a, b / 2)</text>
    <text x="200" y="245" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Độ phức tạp thời gian: O(N) hoặc O(log N)</text>
  </g>

  <!-- Right: Branching Recursion -->
  <g transform="translate(520, 100)" filter="url(#cardShadow)">
    <rect width="400" height="260" rx="12" fill="url(#blueCard)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="200" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. ĐỆ QUY PHÂN NHÁNH (BRANCHING)</text>
    <text x="200" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mỗi frame gọi >= 2 lời gọi đệ quy con</text>

    <rect x="25" y="78" width="350" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="200" y="104" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cây thực thi: Cây nhị phân / Đa phân bùng nổ</text>

    <text x="40" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Đệ quy nhị phân: fib(n-1) + fib(n-2) (O(2^N))</text>
    <text x="40" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Tháp Hà Nội: Chuyển N đĩa qua cọc trung gian</text>
    <text x="40" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Đa phân: Sinh hoán vị, Duyệt mọi tập con</text>
    <text x="200" y="245" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Độ phức tạp thời gian: O(2^N) hoặc O(K^N)</text>
  </g>

</svg>