<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#0284C7" /></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#D97706" /></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9333EA" /></marker>
  </defs>

  <rect width="1000" height="400" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" rx="16" />

  <!-- Title & Subtitle -->
  <text x="500" y="40" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">CÂY ĐỆ QUY PHÂN NHÁNH FIBONACCI F(5) &amp; BÙNG NỔ TÍNH TOÁN</text>
  <text x="500" y="65" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Minh họa hiện tượng bài toán con trùng lặp (Overlapping Subproblems) dẫn tới độ phức tạp Θ(φᴺ)</text>

  <!-- Level 0: F(5) -->
  <g transform="translate(450, 85)">
    <rect width="100" height="42" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="50" y="27" fill="#1E3A8A" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">F(5)</text>
  </g>

  <!-- Level 0 -> Level 1 edges -->
  <path d="M 470 127 L 310 160" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 530 127 L 690 160" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Level 1: F(4) and F(3) -->
  <g transform="translate(260, 165)">
    <rect width="100" height="42" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
    <text x="50" y="27" fill="#0369A1" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">F(4)</text>
  </g>
  <g transform="translate(640, 165)">
    <rect width="100" height="42" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
    <text x="50" y="27" fill="#92400E" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">F(3)</text>
    <rect x="15" y="-12" width="70" height="18" rx="4" fill="#F59E0B" />
    <text x="50" y="1" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">LẶP LẦN 2</text>
  </g>

  <!-- Level 1 -> Level 2 edges -->
  <path d="M 285 207 L 185 245" fill="none" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <path d="M 335 207 L 435 245" fill="none" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <path d="M 665 207 L 595 245" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)" />
  <path d="M 715 207 L 785 245" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)" />

  <!-- Level 2: F(3), F(2), F(2), F(1) -->
  <g transform="translate(135, 250)">
    <rect width="95" height="38" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
    <text x="47" y="25" fill="#92400E" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">F(3)</text>
    <rect x="12" y="-12" width="70" height="18" rx="4" fill="#F59E0B" />
    <text x="47" y="1" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">LẶP LẦN 1</text>
  </g>
  <g transform="translate(390, 250)">
    <rect width="90" height="38" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="2" />
    <text x="45" y="25" fill="#6B21A8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">F(2)</text>
    <rect x="10" y="-12" width="70" height="18" rx="4" fill="#A855F7" />
    <text x="45" y="1" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">LẶP LẦN 2</text>
  </g>
  <g transform="translate(550, 250)">
    <rect width="90" height="38" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="2" />
    <text x="45" y="25" fill="#6B21A8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">F(2)</text>
    <rect x="10" y="-12" width="70" height="18" rx="4" fill="#A855F7" />
    <text x="45" y="1" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">LẶP LẦN 3</text>
  </g>
  <g transform="translate(740, 250)">
    <rect width="90" height="38" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <text x="45" y="25" fill="#047857" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">F(1)</text>
  </g>

  <!-- Level 2 -> Level 3 edges -->
  <path d="M 160 288 L 105 325" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)" />
  <path d="M 205 288 L 260 325" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)" />

  <!-- Level 3: F(2), F(1) -->
  <g transform="translate(60, 330)">
    <rect width="90" height="38" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="2" />
    <text x="45" y="25" fill="#6B21A8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">F(2)</text>
    <rect x="10" y="-12" width="70" height="18" rx="4" fill="#A855F7" />
    <text x="45" y="1" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">LẶP LẦN 1</text>
  </g>
  <g transform="translate(220, 330)">
    <rect width="90" height="38" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <text x="45" y="25" fill="#047857" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">F(1)</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(360, 325)">
    <rect width="580" height="50" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="25" cy="25" r="8" fill="#F59E0B" />
    <text x="40" y="29" fill="#92400E" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">F(3) tính lại 2 lần</text>
    <circle cx="180" cy="25" r="8" fill="#A855F7" />
    <text x="195" y="29" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">F(2) tính lại 3 lần</text>
    <text x="350" y="29" fill="#0369A1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">➔ Cần Quy Hoạch Động (DP)</text>
  </g>

</svg>