<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
  </defs>

  <rect width="1000" height="390" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="390" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />

  
  <text x="500" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">CẤU TRÚC ĐIỀU HƯỚNG CỦA HÀM ĐỆ QUY f(N)</text>
  <text x="500" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Phân định 2 trường hợp sống còn: Điểm dừng cơ sở (Base Case) vs Bước thu nhỏ (Recursive Step)</text>

  <!-- Top Root -->
  <g transform="translate(370, 95)" filter="url(#cardShadow)">
    <rect width="260" height="55" rx="10" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <text x="130" y="26" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">HÀM ĐỆ QUY f(N)</text>
    <text x="130" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Nhận tham số quy mô N</text>
  </g>

  <!-- Left Arrow (Base Case) -->
  <path d="M 430 150 L 280 200" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <rect x="290" y="160" width="130" height="24" rx="4" fill="#064e3b" /><text x="355" y="176" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">N là Base Case?</text>

  <!-- Right Arrow (Recursive Step) -->
  <path d="M 570 150 L 720 200" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  <rect x="580" y="160" width="140" height="24" rx="4" fill="#0369a1" /><text x="650" y="176" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">N là Recursive Case?</text>

  <!-- Left Card: Base Case Action -->
  <g transform="translate(100, 210)" filter="url(#cardShadow)">
    <rect width="360" height="150" rx="12" fill="url(#greenCard)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="180" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TRẢ VỀ ĐÁP ÁN NGAY LẬP TỨC</text>
    <text x="180" y="58" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ngắt đệ quy, không gọi thêm frame mới</text>
    <rect x="30" y="78" width="300" height="45" rx="6" fill="#022c22" stroke="#10b981" />
    <text x="180" y="106" fill="#6ee7b7" font-family="monospace" font-size="13.5" font-weight="bold" text-anchor="middle">if (n &lt;= 1) return 1;</text>
  </g>

  <!-- Right Card: Recursive Step Action -->
  <g transform="translate(540, 210)" filter="url(#cardShadow)">
    <rect width="360" height="150" rx="12" fill="url(#cyanCard)" stroke="#0ea5e9" stroke-width="2" filter="url(#glowCyan)" />
    <text x="180" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">THU NHỎ QUY MÔ BÀI TOÁN</text>
    <text x="180" y="58" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Gọi f(N-1) hoặc f(N/2) và kết hợp kết quả</text>
    <rect x="30" y="78" width="300" height="45" rx="6" fill="#082f49" stroke="#38bdf8" />
    <text x="180" y="106" fill="#7dd3fc" font-family="monospace" font-size="13.5" font-weight="bold" text-anchor="middle">return n * fact(n - 1);</text>
  </g>

</svg>